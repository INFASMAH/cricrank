/* ══ ADMIN VIDEO ══ */
function AdminVideo(){
  const settings=useSettings();
  const [tab,setTab]=useState('upload');
  const [videoData,setVideoData]=useState(null);
  const [ytLink,setYtLink]=useState('');
  const [label,setLabel]=useState('🎬 Highlight Reel');
  const [loading,setLoading]=useState(false);
  const videoRef=React.useRef(null);

  useEffect(()=>{
    if(settings.videoData)setVideoData(settings.videoData);
    if(settings.videoUrl)setYtLink(settings.videoUrl);
    if(settings.videoLabel)setLabel(settings.videoLabel);
  },[settings.videoData,settings.videoUrl,settings.videoLabel]);

  const getYtId=(url)=>{
    const m=url.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|.*[?&]v=))([^"&?/\s]{11})/);
    return m?m[1]:null;
  };

  const getInstaId=(url)=>{
    const m=url.match(/instagram\.com\/(?:p|reel)\/([A-Za-z0-9_-]+)/);
    return m?m[1]:null;
  };

  const [uploadProgress,setUploadProgress]=useState(0);
  const [videoFile,setVideoFile]=useState(null);

  const readVideo=(file)=>{
    if(file.size>500*1024*1024){showToast('Max 500MB video','err');return;}
    setVideoFile(file);
    // Show local preview
    const url=URL.createObjectURL(file);
    setVideoData(url);
  };

  const save=async()=>{
    setLoading(true);
    try{
      const data={videoLabel:label,videoActive:true};
      if(tab==='upload'&&videoFile){
        // Upload to Firebase Storage
        setUploadProgress(0);
        const ref=storage.ref('videos/home_video_'+Date.now()+'.'+videoFile.name.split('.').pop());
        const task=ref.put(videoFile);
        await new Promise((res,rej)=>{
          task.on('state_changed',
            snap=>setUploadProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)),
            rej,
            async()=>{
              const url=await ref.getDownloadURL();
              data.videoUrl=url;
              data.videoData=null;
              data.videoType='upload';
              res();
            }
          );
        });
      }else if(tab==='link'&&ytLink.trim()){
        data.videoUrl=ytLink.trim();
        data.videoData=null;
        data.videoType=getYtId(ytLink)?'youtube':getInstaId(ytLink)?'instagram':'link';
      }else{showToast('Add video or link','err');setLoading(false);return;}
      await db.collection('settings').doc('main').set(data,{merge:true});
      showToast('Video saved! 🎥');
      setUploadProgress(0);setVideoFile(null);
    }catch(e){showToast('Failed: '+e.message,'err');setUploadProgress(0);}
    setLoading(false);
  };

  const remove=async()=>{
    await db.collection('settings').doc('main').set({videoData:null,videoUrl:'',videoActive:false},{merge:true});
    setVideoData(null);setYtLink('');
    showToast('Video removed!');
  };

  const ytId=getYtId(ytLink);
  const instaId=getInstaId(ytLink);

  return <div>
    <div className="sec-h"><div><div className="sec-t">🎥 Home Video</div><div className="sec-s">Show highlight video on user home screen</div></div></div>
    {(settings.videoActive&&(settings.videoData||settings.videoUrl))&&<div style={{marginBottom:14}}>
      <div style={{fontWeight:700,color:'var(--text2)',fontSize:13,marginBottom:8}}>Currently showing:</div>
      {settings.videoType==='upload'&&settings.videoUrl&&<video src={settings.videoUrl} controls style={{width:'100%',maxHeight:200,borderRadius:12,background:'#000'}}/>}
      {settings.videoType==='youtube'&&<iframe src={'https://www.youtube.com/embed/'+getYtId(settings.videoUrl)+'?autoplay=0'} style={{width:'100%',height:200,borderRadius:12,border:'none'}} allowFullScreen/>}
      <button className="btn" style={{marginTop:8,background:'rgba(239,68,68,.15)',color:'#ef4444',border:'1px solid rgba(239,68,68,.3)'}} onClick={remove}>🗑️ Remove Video</button>
    </div>}
    <div className="card">
      <div className="tabs" style={{marginBottom:14}}>
        <button className={'tab'+(tab==='upload'?' on':'')} onClick={()=>setTab('upload')}>📱 Upload Video</button>
        <button className={'tab'+(tab==='link'?' on':'')} onClick={()=>setTab('link')}>🔗 YouTube / Link</button>
      </div>
      {tab==='upload'&&<>
        <div className="video-upload-box" onClick={()=>videoRef.current&&videoRef.current.click()}>
          {videoData
            ?<video src={videoData} controls style={{width:'100%',maxHeight:180,borderRadius:8}}/>
            :<><div style={{fontSize:40,marginBottom:8}}>🎬</div><div style={{color:'#60a5fa',fontSize:14,fontWeight:600}}>Tap to upload video</div><div style={{color:'#475569',fontSize:12,marginTop:4}}>MP4, MOV supported • Max 500MB</div></>}
        </div>
        <input type="file" ref={videoRef} accept="video/*" style={{display:'none'}} onChange={e=>{if(e.target.files[0])readVideo(e.target.files[0]);}}/>
        {uploadProgress>0&&uploadProgress<100&&<div style={{marginTop:10}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#60a5fa',marginBottom:4}}>
            <span>Uploading...</span><span>{uploadProgress}%</span>
          </div>
          <div style={{background:'var(--input-bg)',borderRadius:20,height:8,overflow:'hidden'}}>
            <div style={{height:'100%',background:'linear-gradient(90deg,#3b82f6,#1d4ed8)',borderRadius:20,width:uploadProgress+'%',transition:'width .3s'}}/>
          </div>
        </div>}
        {videoData&&!loading&&<button className="btn bs2" style={{marginTop:8}} onClick={()=>{setVideoData(null);setVideoFile(null);}}>Remove</button>}
      </>}
      {tab==='link'&&<>
        <div className="fg"><label className="lbl">YouTube / Video URL</label>
          <input className="inp" value={ytLink} onChange={e=>setYtLink(e.target.value)} placeholder="https://youtube.com/watch?v=... or https://youtu.be/..."/>
        </div>
        {ytId&&<div style={{marginTop:8,borderRadius:10,overflow:'hidden'}}>
          <div style={{fontSize:11,color:'#60a5fa',marginBottom:6}}>Preview:</div>
          <iframe src={'https://www.youtube.com/embed/'+ytId} style={{width:'100%',height:180,border:'none',borderRadius:10}} allowFullScreen/>
        </div>}
        {!ytId&&ytLink&&<div style={{fontSize:12,color:'#f59e0b',marginTop:4}}>⚠️ Paste a valid YouTube link for preview</div>}
      </>}
      <div className="fg" style={{marginTop:14}}><label className="lbl">Video Label</label>
        <input className="inp" value={label} onChange={e=>setLabel(e.target.value)} placeholder="e.g. 🎬 Match Highlights"/>
      </div>
      <button className="btn bs1" style={{width:'100%',background:'linear-gradient(135deg,#7c3aed,#6d28d9)'}} onClick={save} disabled={loading}>
        {loading?'Saving...':'💾 Save & Show on Home'}
      </button>
    </div>
  </div>;
}

/* ══ SHARE RANKINGS ══ */
function ShareBtn({title,data,color}){
  const [generating,setGenerating]=useState(false);

  const generateAndShare=async()=>{
    setGenerating(true);
    try{
      const canvas=document.createElement('canvas');
      const W=800,H=100+data.length*110+60;
      canvas.width=W;canvas.height=H;
      const ctx=canvas.getContext('2d');

      // Background gradient
      const bg=ctx.createLinearGradient(0,0,W,H);
      bg.addColorStop(0,'#0a0e27');
      bg.addColorStop(0.5,'#0d1b4a');
      bg.addColorStop(1,'#0a0e27');
      ctx.fillStyle=bg;
      ctx.fillRect(0,0,W,H);

      // Border glow
      ctx.strokeStyle=color||'#f59e0b';
      ctx.lineWidth=3;
      ctx.shadowColor=color||'#f59e0b';
      ctx.shadowBlur=20;
      ctx.strokeRect(2,2,W-4,H-4);
      ctx.shadowBlur=0;

      // Header
      ctx.fillStyle=color||'#f59e0b';
      ctx.font='bold 28px Arial';
      ctx.textAlign='center';
      ctx.fillText('🏆 '+title, W/2, 50);

      // CRIX label
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.font='14px Arial';
      ctx.fillText('CricRank Cricket Platform', W/2, 78);

      // Divider
      ctx.strokeStyle=color||'#f59e0b';
      ctx.lineWidth=1;
      ctx.shadowBlur=0;
      ctx.beginPath();ctx.moveTo(40,90);ctx.lineTo(W-40,90);ctx.stroke();

      // Draw each player row
      for(let i=0;i<data.length;i++){
        const item=data[i];
        const y=110+i*110;

        // Row bg
        const rowBg=ctx.createLinearGradient(0,y,W,y+90);
        rowBg.addColorStop(0,'rgba(255,255,255,0.04)');
        rowBg.addColorStop(1,'rgba(255,255,255,0.01)');
        ctx.fillStyle=rowBg;
        ctx.beginPath();
        ctx.roundRect(20,y,W-40,90,12);
        ctx.fill();

        // Rank badge
        const rankColors=['#f59e0b','#94a3b8','#b45309'];
        const rankBg=i<3?rankColors[i]:'#334155';
        ctx.fillStyle=rankBg;
        ctx.beginPath();ctx.arc(70,y+45,26,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=i<3?'#000':'#fff';
        ctx.font='bold 20px Arial';
        ctx.textAlign='center';
        ctx.fillText('#'+(i+1),70,y+52);

        // Profile photo circle
        ctx.fillStyle='#1e293b';
        ctx.beginPath();ctx.arc(145,y+45,36,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=color||'#f59e0b';
        ctx.lineWidth=2;
        ctx.stroke();

        // Try to draw photo
        if(item.photo){
          try{
            const img=new Image();
            img.crossOrigin='anonymous';
            await new Promise((res,rej)=>{
              img.onload=res;img.onerror=rej;
              img.src=item.photo;
              setTimeout(rej,2000);
            });
            ctx.save();
            ctx.beginPath();ctx.arc(145,y+45,34,0,Math.PI*2);ctx.clip();
            ctx.drawImage(img,111,y+11,68,68);
            ctx.restore();
          }catch(e){
            // fallback: initial letter
            ctx.fillStyle=color||'#f59e0b';
            ctx.font='bold 28px Arial';
            ctx.textAlign='center';
            ctx.fillText((item.name||'?')[0].toUpperCase(),145,y+55);
          }
        }else{
          ctx.fillStyle=color||'#f59e0b';
          ctx.font='bold 28px Arial';
          ctx.textAlign='center';
          ctx.fillText((item.name||'?')[0].toUpperCase(),145,y+55);
        }

        // Name
        ctx.fillStyle='#f1f5f9';
        ctx.font='bold 20px Arial';
        ctx.textAlign='left';
        ctx.fillText(item.name||'',195,y+32);

        // Team
        ctx.fillStyle='rgba(255,255,255,0.45)';
        ctx.font='14px Arial';
        ctx.fillText(item.team||'',195,y+54);

        // Points badge
        const ptsBg=ctx.createLinearGradient(W-180,y+28,W-60,y+28);
        ptsBg.addColorStop(0,color||'#f59e0b');
        ptsBg.addColorStop(1,(color||'#f59e0b')+'aa');
        ctx.fillStyle=ptsBg;
        ctx.beginPath();ctx.roundRect(W-180,y+28,120,36,18);ctx.fill();
        ctx.fillStyle='#000';
        ctx.font='bold 18px Arial';
        ctx.textAlign='center';
        ctx.fillText(item.pts+' pts',W-120,y+52);

        // Extra stat
        if(item.stat){
          ctx.fillStyle='rgba(255,255,255,0.5)';
          ctx.font='13px Arial';
          ctx.textAlign='left';
          ctx.fillText(item.stat,195,y+74);
        }
      }

      // Footer
      ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.font='13px Arial';
      ctx.textAlign='center';
      ctx.fillText('🏏 CricRank — Cricket Rankings Platform',W/2,H-18);

      // Convert to blob and share
      canvas.toBlob(async(blob)=>{
        const file=new File([blob],'CricRank-Rankings.png',{type:'image/png'});
        if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({title:'CricRank — '+title,files:[file]}).catch(()=>{});
        }else{
          // Fallback: download
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;a.download='CricRank-'+title+'.png';a.click();
          URL.revokeObjectURL(url);
          showToast('Image downloaded! Share it on WhatsApp 📤');
        }
        setGenerating(false);
      },'image/png');
    }catch(e){
      showToast('Failed to generate image','err');
      setGenerating(false);
    }
  };

  return <button className="share-btn" onClick={generateAndShare} disabled={generating}>
    <span>{generating?'⏳':'📤'}</span>{generating?'Generating...':'Share Image'}
  </button>;
}

function AdminAnnouncements(){

  const [loading,setLoading]=useState(false);
  const [editId,setEditId]=useState(null);

  const resizeImg=(file)=>new Promise(res=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1024;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=img.width*scale;c.height=img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.8));

    <div className="sec-h"><div><div className="sec-t">📢 Announcements</div><div className="sec-s">Post banners to user home screen</div></div></div>
    <div className="card">
      <div className="fg"><label className="lbl">Title *</label><input className="inp" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Match Tomorrow!"/></div>
      <div className="fg"><label className="lbl">Message *</label><textarea className="inp" value={form.msg} onChange={e=>setForm({...form,msg:e.target.value})} placeholder="Enter your announcement..." rows={3} style={{resize:'vertical'}}/></div>
      <div className="fg"><label className="lbl">Type</label>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {Object.entries(typeInfo).map(([k,v])=><button key={k} onClick={()=>setForm({...form,type:k})} style={{background:form.type===k?v.color:'var(--input-bg)',color:form.type===k?'#000':'var(--text3)',border:'1px solid '+(form.type===k?v.color:'var(--border2)'),borderRadius:8,padding:'6px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>{v.label}</button>)}
        </div>
      </div>
      <div className="fg">
        <label className="lbl">🖼️ Image (optional)</label>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          {form.image
            ?<><img src={form.image} style={{width:80,height:60,objectFit:'cover',borderRadius:8,border:'1px solid var(--border2)'}} alt="ann"/>
              <button className="btn bs2" style={{fontSize:11}} onClick={()=>setForm({...form,image:null})}>✕ Remove</button></>
            :<button className="btn bs2" style={{fontSize:11}} onClick={()=>imgRef.current&&imgRef.current.click()}>📷 Add Image</button>
          }
        </div>
        <input type="file" ref={imgRef} accept="image/*" style={{display:'none'}} onChange={async e=>{
          if(e.target.files[0]){const r=await resizeImg(e.target.files[0]);setForm({...form,image:r});}
        }}/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn bs1" onClick={save} disabled={loading} style={{flex:1}}>
          {loading?'Saving...':(editId?'✅ Update Announcement':'📢 Post Announcement')}
        </button>
        {editId&&<button className="btn bs2" onClick={()=>{setEditId(null);setForm({title:'',msg:'',type:'info',active:true,image:null});}}>Cancel</button>}
      </div>
      {editId&&<div style={{fontSize:11,color:'#f59e0b',marginTop:6}}>✏️ Editing existing announcement</div>}
    </div>
    <div style={{marginTop:8}}>
      {anns.length===0&&<div style={{textAlign:'center',padding:30,color:'var(--text5)'}}>No announcements yet</div>}
      {[...anns].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(ann=><div key={ann.id} className="card" style={{borderLeft:'3px solid '+(typeInfo[ann.type]?.color||'#3b82f6'),opacity:ann.active?1:0.5}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
          <div style={{flex:1}}>
            {ann.image&&<img src={ann.image} style={{width:'100%',maxHeight:100,objectFit:'cover',borderRadius:8,marginBottom:8,display:'block'}} alt="ann"/>}
          <div style={{fontWeight:700,color:'var(--text1)',fontSize:13,marginBottom:3}}>{ann.title}</div>
            <div style={{fontSize:12,color:'var(--text4)',lineHeight:1.5}}>{ann.msg}</div>
            <div style={{marginTop:6,display:'flex',gap:6,alignItems:'center'}}>
              <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10,background:typeInfo[ann.type]?.color+'22',color:typeInfo[ann.type]?.color}}>{typeInfo[ann.type]?.label}</span>
              <span style={{fontSize:10,color:'var(--text5)'}}>{ann.active?'🟢 Visible':'⚫ Hidden'}</span>
            </div>
          </div>
          <div style={{display:'flex',gap:6,flexShrink:0}}>
            <button className="btn" style={{fontSize:11,padding:'4px 8px',background:'rgba(245,158,11,.15)',color:'#f59e0b',border:'1px solid rgba(245,158,11,.3)'}} onClick={()=>startEdit(ann)}>✏️ Edit</button>
            <button className="btn bs2" style={{fontSize:11,padding:'4px 8px'}} onClick={()=>toggle(ann)}>{ann.active?'Hide':'Show'}</button>
            <button className="btn" style={{fontSize:11,padding:'4px 8px',background:'rgba(239,68,68,.15)',color:'#ef4444',border:'1px solid rgba(239,68,68,.3)'}} onClick={()=>del(ann.id)}>🗑️</button>
          </div>
        </div>
      </div>)}
    </div>
  </div>;
}


/* ══ ADMIN SETTINGS ══ */
function AdminSettings(){
  const settings=useSettings();
  const [bgImg,setBgImg]=useState(null);
  const [loading,setLoading]=useState(false);
  const bgRef=useRef(null);

  useEffect(()=>{if(settings.heroBg)setBgImg(settings.heroBg);},[settings.heroBg]);

  const readFile=(file,setter)=>{
    const r=new FileReader();
    r.onload=e=>setter(e.target.result);
    r.readAsDataURL(file);
  };

  const saveBg=async()=>{
    if(!bgImg){showToast('Upload an image first','err');return;}
    setLoading(true);
    try{
      await db.collection('settings').doc('main').set({heroBg:bgImg},{merge:true});
      showToast('Hero background saved! 🎉');
    }catch(e){showToast('Failed to save','err');}
    setLoading(false);
  };

  const removeBg=async()=>{
    await db.collection('settings').doc('main').set({heroBg:null},{merge:true});
    setBgImg(null);
    showToast('Background removed!');
  };

  return <div>
    <div className="sec-h"><div><div className="sec-t">⚙️ Settings</div><div className="sec-s">Customize tournament appearance</div></div></div>
    <div className="card">
      <div style={{fontWeight:700,color:'var(--text1)',marginBottom:4}}>🖼️ Hero Card Background</div>
      <div style={{fontSize:12,color:'var(--text4)',marginBottom:14}}>This image shows behind the #1 player card in Batting, Bowling and All-Rounder pages</div>
      {bgImg&&<div style={{position:'relative',marginBottom:14,borderRadius:14,overflow:'hidden',border:'2px solid #f59e0b'}}>
        <img src={bgImg} style={{width:'100%',maxHeight:200,objectFit:'cover',display:'block'}} alt="bg"/>
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{textAlign:'center',color:'#fff'}}>
            <div style={{fontSize:36}}>👑</div>
            <div style={{fontWeight:700,fontSize:14}}>Preview</div>
          </div>
        </div>
      </div>}
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <button className="btn bs1" onClick={()=>bgRef.current&&bgRef.current.click()}>📷 {bgImg?'Change':'Upload'} Background</button>
        {bgImg&&<button className="btn bs2" onClick={removeBg}>🗑️ Remove</button>}
        {bgImg&&<button className="btn bs1" style={{background:'linear-gradient(135deg,#16a34a,#15803d)'}} onClick={saveBg} disabled={loading}>{loading?'Saving...':'💾 Save'}</button>}
      </div>
      <input type="file" ref={bgRef} accept="image/*" style={{display:'none'}} onChange={e=>{if(e.target.files[0])readFile(e.target.files[0],setBgImg);}}/>
      <div style={{marginTop:10,fontSize:11,color:'var(--text5)'}}>💡 Tip: Use a cricket stadium or action photo. Dark images work best!</div>
    </div>
  </div>;
}

/* ══ SIDEBAR ══ */
function Sidebar({page,setPage,isAdmin,isDay,toggle,logo,onLogout}){
  const ADMIN_NAV=[
    {sec:'Main',links:[{id:'dashboard',ic:'🏠',l:'Dashboard'},{id:'rankings',ic:'📊',l:'Rankings'}]},
    {sec:'Manage',links:[{id:'teams',ic:'🛡️',l:'Teams'},{id:'players',ic:'👤',l:'Players'},{id:'matches',ic:'⚡',l:'Matches'}]},
    {sec:'More',links:[{id:'userview',ic:'🌐',l:'User View'},{id:'chats',ic:'💬',l:'Chats'},{id:'registrations',ic:'📋',l:'Registrations'},{id:'announcements',ic:'📢',l:'Announcements'},{id:'livescore',ic:'🔴',l:'Live Score'},{id:'video',ic:'🎥',l:'Home Video'},{id:'potm',ic:'🏅',l:'Player of Tour.'},{id:'pushnotif',ic:'🔔',l:'Push Notify'},{id:'gallery',ic:'📸',l:'Gallery'},{id:'settings',ic:'⚙️',l:'Settings'}]},
  ];
  return <div className="sidebar">
    <div style={{padding:'12px 14px',borderBottom:'1px solid var(--sidebar-border)'}}>
      <img src={'data:image/png;base64,'+logo} alt="CRIX" style={{height:40,maxWidth:160,objectFit:'contain',display:'block',filter:'drop-shadow(0 1px 6px rgba(99,179,237,0.4))'}}/>
    </div>
    <div style={{flex:1,overflowY:'auto',padding:'8px 0'}}>
      {ADMIN_NAV.map(sec=><div key={sec.sec} style={{marginBottom:4}}>
        <div style={{padding:'6px 14px',fontSize:10,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:1}}>{sec.sec}</div>
        {sec.links.map(l=><button key={l.id} className={'nl'+(page===l.id?' on':'')} onClick={()=>setPage(l.id)} dangerouslySetInnerHTML={{__html:l.ic+' '+l.l}}/>)}
      </div>)}
    </div>
    <div style={{padding:'10px 14px',borderTop:'1px solid var(--sidebar-border)'}}>
      <button onClick={toggle} className="nl" style={{width:'100%',marginBottom:6}} dangerouslySetInnerHTML={{__html:(isDay?'🌙':'☀️')+' '+(isDay?'Dark Mode':'Light Mode')}}/>
      <button onClick={onLogout} className="lo-btn" style={{width:'100%'}}>🚪 Sign Out</button>
    </div>
  </div>;
}

/* ══ APP ══ */
function App(){
  const teams=useFirestore('teams');
  const players=useFirestore('players');
  const matches=useFirestore('matches');

  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  const [subPage,setSubPage]=useState(null);
  const [mobOpen,setMobOpen]=useState(false);
  const {isDay,toggle}=useTheme();

  if(!user)return <Login onLogin={u=>{setUser(u);setPage('dashboard');setSubPage(null);}} players={players}/>;

  const isAdmin=user.role==='admin';

  const renderPage=()=>{
    if(!isAdmin){
      if(subPage==='batting')return <><UserBatting players={players} onBack={()=>setSubPage(null)}/><UserChat user={user}/></>;
      if(subPage==='bowling')return <><UserBowling players={players} onBack={()=>setSubPage(null)}/><UserChat user={user}/></>;
      if(subPage==='allround')return <><UserAllRounders players={players} onBack={()=>setSubPage(null)}/><UserChat user={user}/></>;
      if(subPage==='teams')return <><UserTeams teams={teams} players={players} onBack={()=>setSubPage(null)}/><UserChat user={user}/></>;
      if(subPage==='gallery')return <><TeamGallery teams={teams} onBack={()=>setSubPage(null)}/><UserChat user={user}/></>;
      if(subPage==='fanvote')return <><FanVote players={players} user={user}/><UserChat user={user}/></>;
      if(subPage==='mystats')return <><MyStats players={players} teams={teams} matches={matches} user={user} onBack={()=>setSubPage(null)}/><UserChat user={user}/></>;
      return <><UserHome teams={teams} players={players} matches={matches} setSubPage={setSubPage}/><UserChat user={user}/></>;
    }
    switch(page){
      case 'teams': return <AdminTeams teams={teams} setTeams={()=>{}} matches={matches}/>;
      case 'players': return <AdminPlayers players={players} teams={teams}/>;
      case 'matches': return <AdminMatches matches={matches} setMatches={()=>{}} teams={teams} players={players}/>;
      case 'rankings': return <AdminRankings teams={teams} players={players} setPlayers={()=>{}}/>;
      case 'chats': return <AdminChats/>;
      case 'registrations': return <AdminRegistrations/>;
      case 'announcements': return <AdminAnnouncements/>;
      case 'livescore': return <LiveScoring teams={teams} players={players} matches={matches}/>;
      case 'video': return <AdminVideo/>;
      case 'potm': return <AdminPOTM/>;
      case 'pushnotif': return <AdminPushNotif/>;
      case 'gallery': return <AdminGallery teams={teams}/>;
      case 'settings': return <AdminSettings/>;
      case 'userview': return <><UserHome teams={teams} players={players} matches={matches} setSubPage={setSubPage}/></>;
      default: return <div>
        <div className="sec-h"><div><div className="sec-t">🏠 Dashboard</div><div className="sec-s">Welcome, Admin!</div></div></div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:16}}>
          {[['🛡️',teams.length,'Teams','#3b82f6'],['👤',players.length,'Players','#a78bfa'],['⚡',matches.length,'Matches','#f59e0b'],['📋',0,'Pending','#4ade80']].map(([ic,v,l,c])=><div key={l} className="card" style={{textAlign:'center'}}><div style={{fontSize:24,marginBottom:6}} dangerouslySetInnerHTML={{__html:ic}}/><div style={{fontWeight:800,fontSize:20,color:c}}>{v}</div><div style={{fontSize:11,color:'var(--text4)',marginTop:2}}>{l}</div></div>)}
        </div>
        <div className="card"><div style={{fontWeight:700,color:'var(--text2)',marginBottom:10}}>📊 Quick Rankings</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
            {[['Top Bat',rankBatsmen(players)[0],'#f59e0b'],['Top Bowl',rankBowlers(players)[0],'#60a5fa'],['Top Team',rankTeams(teams)[0],'#4ade80']].map(([l,item,c])=><div key={l} style={{background:'var(--input-bg)',borderRadius:8,padding:'10px',textAlign:'center'}}><div style={{fontSize:10,color:'var(--text4)',marginBottom:4}}>{l}</div><div style={{fontWeight:700,color:c,fontSize:13}}>{item?(item.name||'—'):'—'}</div></div>)}
          </div>
        </div>
      </div>;
    }
  };

  const curTitle=subPage?{teams:'Teams',batting:'Batting',bowling:'Bowling',allround:'All-Rounders'}[subPage]||'Rankings':page;

  return <div className="app">
    {isAdmin&&<>
      {mobOpen&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:50}} onClick={()=>setMobOpen(false)}/>}
      <div style={{display:mobOpen?'flex':'none',position:'fixed',inset:0,zIndex:51,width:210}}>
        <Sidebar page={page} setPage={p=>{setPage(p);setMobOpen(false);}} isAdmin={isAdmin} isDay={isDay} toggle={toggle} logo={LOGO} onLogout={()=>{setUser(null);setPage('dashboard');setSubPage(null);}}/>
      </div>
      <div className="mob-bar">
        <button className="ham" onClick={()=>setMobOpen(true)}>☰</button>
        <span style={{fontWeight:700,color:'var(--text1)',flex:1}}>🏏 {curTitle}</span>
        <button onClick={toggle} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:16}} dangerouslySetInnerHTML={{__html:isDay?'🌙':'☀️'}}/>
      </div>
    </>}
    {isAdmin&&<div style={{width:210,flexShrink:0,display:'flex',height:'100vh'}}><Sidebar page={page} setPage={setPage} isAdmin={isAdmin} isDay={isDay} toggle={toggle} logo={LOGO} onLogout={()=>{setUser(null);setPage('dashboard');setSubPage(null);}}/></div>}
    {isAdmin&&<div style={{flex:1,display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden',flex:1}}>
        <div className="topbar">
          <button className="ham" onClick={()=>setMobOpen(true)} style={{display:'none'}}>☰</button>
          <div style={{flex:1,fontWeight:700,color:'var(--text1)',fontSize:15}} dangerouslySetInnerHTML={{__html:'🏏 '+curTitle}}/>
          <button onClick={toggle} style={{background:'none',border:'1px solid var(--border2)',color:'var(--text3)',borderRadius:20,padding:'4px 10px',fontSize:12,cursor:'pointer'}} dangerouslySetInnerHTML={{__html:isDay?'🌙 Dark':'☀️ Light'}}/>
          <span className="badge bb" style={{fontSize:10}}>{user.name}</span>
          <button className="lo-btn" onClick={()=>{setUser(null);setPage('dashboard');setSubPage(null);}}>🚪</button>
        </div>
        <div className="content">{renderPage()}</div>
      </div>
      <div style={{display:'flex',width:210,flexShrink:0,height:'100vh'}} className="sidebar-area">
        <Sidebar page={page} setPage={setPage} isAdmin={isAdmin} isDay={isDay} toggle={toggle} logo={LOGO} onLogout={()=>{setUser(null);setPage('dashboard');setSubPage(null);}}/>
      </div>
    </div>}
    {!isAdmin&&<div style={{flex:1,overflow:'auto'}}>
      <div className="content">{renderPage()}</div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
