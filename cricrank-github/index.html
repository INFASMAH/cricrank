<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CricRank — Cricket Platform</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRIX">
<meta name="theme-color" content="#0d1b4a">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--bg2:#0f172a;--card-bg:#0f172a;--card-border:#1e293b;--border:#1e293b;--border2:#334155;--text1:#f1f5f9;--text2:#e2e8f0;--text3:#94a3b8;--text4:#64748b;--text5:#475569;--input-bg:#1e293b;--input-border:#334155;--sidebar-bg:#0f172a;--sidebar-border:#1e293b;--topbar-bg:rgba(15,23,42,.95);--row-hover:#1e293b44;--table-border:#0f172a;--infas-bg1:#0a1628;--infas-bg2:#0f2040;--infas-border:#1e3a6e;--infas-name:#fff;--infas-label:#3b82f6;--infas-line1:#3b82f6;--infas-line2:#60a5fa;--infas-contact:#64748b}
.light-mode{--bg:#f0f4f8;--bg2:#fff;--card-bg:#fff;--card-border:#e2e8f0;--border:#e2e8f0;--border2:#cbd5e1;--text1:#0f172a;--text2:#1e293b;--text3:#475569;--text4:#64748b;--text5:#94a3b8;--input-bg:#f8fafc;--input-border:#cbd5e1;--sidebar-bg:#1e3a5f;--sidebar-border:#1e4080;--topbar-bg:rgba(255,255,255,.95);--row-hover:#f1f5f944;--table-border:#f8fafc;--infas-bg1:#1e3a5f;--infas-bg2:#1e4080;--infas-border:#3b82f6;--infas-name:#fff;--infas-label:#93c5fd;--infas-line1:#fbbf24;--infas-line2:#f59e0b;--infas-contact:#bfdbfe}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.content{flex:1;overflow-y:auto;padding:16px}
.mob-bar{display:none;height:50px;background:#0f172a;border-bottom:1px solid #1e293b;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.ham{background:none;border:none;color:var(--text1);font-size:20px;cursor:pointer;padding:4px}
.topbar{background:var(--topbar-bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:16px;margin-bottom:14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sec-t{font-size:18px;font-weight:800;color:var(--text1)}
.sec-s{font-size:12px;color:var(--text4);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.bs1{background:linear-gradient(135deg,#1d4ed8,#1e40af);color:#fff}
.bs2{background:var(--input-bg);color:var(--text2);border:1px solid var(--border2)}
.bsm{padding:5px 10px;font-size:11px}
.inp{width:100%;background:var(--input-bg);border:1px solid var(--input-border);color:var(--text1);border-radius:8px;padding:9px 12px;font-size:16px;outline:none;font-family:'Inter',sans-serif;transition:border-color .15s}
.inp:focus{border-color:#3b82f6}
.sel{width:100%;background:var(--input-bg);border:1px solid var(--input-border);color:var(--text1);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;font-family:'Inter',sans-serif}
.fg{margin-bottom:12px}
.lbl{display:block;font-size:11px;font-weight:600;color:var(--text4);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:9px 10px;border-bottom:1px solid var(--table-border);vertical-align:middle}
.table tr:hover td{background:var(--row-hover)}
.tc{text-align:center}
.ovx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:rgba(34,197,94,.15);color:#22c55e}
.bb{background:rgba(59,130,246,.15);color:#60a5fa}
.bo{background:rgba(245,158,11,.15);color:#f59e0b}
.br{background:rgba(239,68,68,.15);color:#ef4444}
.bp{background:rgba(167,139,250,.15);color:#a78bfa}
.tab{background:none;border:1px solid var(--border2);color:var(--text3);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s}
.tab.on{background:linear-gradient(135deg,#1d4ed8,#1e40af);color:#fff;border-color:transparent}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.nl{width:100%;background:none;border:none;color:var(--text3);text-align:left;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:8px;transition:all .15s}
.nl:hover,.nl.on{background:rgba(59,130,246,.15);color:#60a5fa}
.pill{background:var(--input-bg);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;text-align:center}
.pill-v{font-size:16px;font-weight:800;color:var(--text1)}
.pill-l{font-size:10px;color:var(--text4);margin-top:2px}
.mdl-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl-box{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-lg{max-width:600px}
.mdl-hd{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mdl-body{padding:20px}
.lo-btn{background:none;border:1px solid var(--border2);color:var(--text4);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.pulse{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.p-hero{background:linear-gradient(135deg,#0a1628,#1a0a3a);padding:20px;text-align:center;border-radius:12px;margin-bottom:14px}
.p-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #22c55e;margin:0 auto 10px;display:block}
.p-ph-ph{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#4c1d95);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;margin:0 auto 10px;border:3px solid #22c55e}
/* LOGIN */
.login-page{min-height:100vh;background:linear-gradient(135deg,#0a0e27 0%,#0d1b4a 30%,#0f2855 55%,#1a1035 80%,#0a0e27 100%);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.l-card{background:linear-gradient(160deg,#0d1f3c 0%,#0a1628 35%,#12103a 70%,#0d1f3c 100%);border:1.5px solid rgba(99,179,237,0.3);border-radius:20px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 12px 60px rgba(0,40,120,0.6),0 0 40px rgba(60,100,255,0.15)}
/* INFAS HEADER */
.infas-header{background:linear-gradient(160deg,var(--infas-bg1),var(--infas-bg2));border:1px solid var(--infas-border);border-radius:16px;padding:20px 16px 16px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden}
/* BIG NAV */
.big-nav-btn{background:linear-gradient(135deg,#0c1f3a,#0a1628);border:1px solid #1e3a6e;border-radius:14px;padding:18px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;text-align:left}
.big-nav-btn:hover{border-color:#3b82f6;transform:translateY(-1px)}
.bnl{font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:2px}
.bns{font-size:11px;color:#475569}
/* RANK HERO */
.rank1-hero{background:linear-gradient(135deg,#1a1200,#2d1f00,#1a0a00);border:2px solid #f59e0b;border-radius:20px;padding:28px 20px 22px;margin-bottom:18px;text-align:center;position:relative;overflow:hidden}
.rank1-photo{width:130px;height:130px;border-radius:50%;object-fit:cover;object-position:center top;border:4px solid #f59e0b;box-shadow:0 0 32px rgba(251,191,36,.6);margin:0 auto 12px;display:block}
.rank1-avatar{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#000;margin:0 auto 12px;box-shadow:0 0 32px rgba(251,191,36,.5)}
.rank1-name{font-size:20px;font-weight:800;color:#fef3c7;margin-bottom:3px}
.rank1-team{font-size:12px;color:#92400e;margin-bottom:10px}
.rank1-pts{display:inline-block;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:900;font-size:20px;padding:6px 20px;border-radius:30px;margin-bottom:12px}
.rank1-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.rank1-stat{text-align:center}
.rank1-stat-v{font-size:14px;font-weight:700;color:#fbbf24}
.rank1-stat-l{font-size:10px;color:#92400e;margin-top:1px}
.rank1-badge{position:absolute;top:10px;right:12px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
/* CHAT */
.chat-fab{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 20px rgba(59,130,246,.5);z-index:200;transition:all .2s}
.chat-window{position:fixed;bottom:85px;right:22px;width:320px;max-height:460px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;box-shadow:0 12px 48px rgba(0,0,0,.45);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.chat-head{padding:12px 14px;background:linear-gradient(135deg,#1e3a5f,#0f2540);display:flex;align-items:center;gap:10px}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:280px}
.chat-msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.45}
.chat-msg.mine{align-self:flex-end;background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-bottom-right-radius:4px}
.chat-msg.theirs{align-self:flex-start;background:var(--input-bg);color:var(--text1);border-bottom-left-radius:4px;border:1px solid var(--border2)}
.chat-msg.welcome{align-self:center;background:linear-gradient(135deg,#052e16,#065f46);border:1px solid #4ade80;max-width:95%;text-align:center}
.cm-name{font-size:10px;font-weight:700;color:#60a5fa;margin-bottom:3px}
.cm-time{font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;text-align:right}
.chat-inp-row{padding:10px 12px;border-top:1px solid var(--border2);display:flex;gap:8px;align-items:center}
.chat-inp{flex:1;background:var(--input-bg);border:1px solid var(--input-border);color:var(--text1);border-radius:10px;padding:8px 11px;font-size:16px;outline:none;font-family:'Inter',sans-serif}
.chat-send{background:linear-gradient(135deg,#3b82f6,#1d4ed8);border:none;border-radius:10px;padding:8px 12px;cursor:pointer;color:#fff;font-size:14px}
.chat-badge{position:absolute;top:-3px;right:-3px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.admin-chat-user{padding:12px 16px;cursor:pointer;border-radius:10px;display:flex;align-items:center;gap:10px;border:1px solid transparent;transition:all .2s}
.admin-chat-user:hover{background:var(--input-bg);border-color:var(--border2)}
.admin-chat-user.unread{border-color:#3b82f6;background:rgba(59,130,246,.08)}
/* REGISTRATION */
.reg-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.reg-box{background:linear-gradient(160deg,#0d1f3c,#0a1628,#12103a);border:1.5px solid rgba(99,179,237,0.3);border-radius:20px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 12px 60px rgba(0,40,120,0.6);text-align:center}
.reg-form-box{background:linear-gradient(160deg,#0d1f3c,#0a1628,#12103a);border:1.5px solid rgba(99,179,237,0.3);border-radius:20px;padding:24px 20px;width:100%;max-width:400px;box-shadow:0 12px 60px rgba(0,40,120,0.6);max-height:90vh;overflow-y:auto}
.reg-inp{width:100%;background:rgba(15,37,64,0.8);border:1px solid rgba(99,179,237,0.25);color:#e2e8f0;border-radius:10px;padding:10px 12px;font-size:16px;outline:none;font-family:'Inter',sans-serif;box-sizing:border-box}
.reg-inp:focus{border-color:#3b82f6}
.reg-sel{width:100%;background:rgba(15,37,64,0.8);border:1px solid rgba(99,179,237,0.25);color:#e2e8f0;border-radius:10px;padding:10px 12px;font-size:14px;outline:none;font-family:'Inter',sans-serif;box-sizing:border-box}
.reg-upload{border:1.5px dashed rgba(99,179,237,0.3);border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:rgba(15,37,64,0.4)}
.reg-submit{width:100%;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.reg-submit:disabled{opacity:0.6;cursor:not-allowed}
.reg-cancel{width:100%;background:none;border:none;color:#475569;font-size:12px;cursor:pointer;padding:10px;margin-top:4px}
.reg-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px}
.reg-card.pending{border-left:3px solid #f59e0b}
.reg-card.approved{border-left:3px solid #4ade80;opacity:0.7}
.reg-card.rejected{border-left:3px solid #ef4444;opacity:0.6}
/* MOBILE */
@media(max-width:768px){.sidebar{display:none}.mob-bar{display:flex}}
@media(max-width:480px){
  .login-page{padding:12px;padding-top:30px;align-items:flex-start}
  .l-card{padding:24px 16px;border-radius:16px}
  .content{padding:10px 8px}
  .chat-window{right:8px;left:8px;width:auto;bottom:80px;max-height:70vh}
  .chat-fab{bottom:16px;right:16px}
  .rank1-photo{width:100px;height:100px}
  .rank1-avatar{width:100px;height:100px;font-size:36px}
  .hide-mob{display:none!important}
  .mdl-box{margin:8px;max-height:92vh}
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ══ CRICKET ANIMATIONS ══ */
@keyframes floatBall{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-18px) rotate(90deg)}50%{transform:translateY(-8px) rotate(180deg)}75%{transform:translateY(-22px) rotate(270deg)}}
@keyframes floatTrophy{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.08)}}
@keyframes floatBat{0%,100%{transform:rotate(-20deg) translateY(0)}50%{transform:rotate(-20deg) translateY(-14px)}}
@keyframes spinWicket{0%,100%{transform:rotate(0deg)}50%{transform:rotate(8deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}
@keyframes dash{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(251,191,36,.2)}50%{box-shadow:0 0 40px rgba(251,191,36,.5),0 0 80px rgba(251,191,36,.2)}}
.infas-header{animation:glowPulse 3s ease-in-out infinite}
.cricket-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:16px}
.c-ball{position:absolute;font-size:28px;animation:floatBall var(--dur,4s) ease-in-out infinite;animation-delay:var(--del,0s);opacity:.18}
.c-trophy{position:absolute;font-size:32px;animation:floatTrophy var(--dur,5s) ease-in-out infinite;animation-delay:var(--del,0s);opacity:.15}
.c-bat{position:absolute;font-size:24px;animation:floatBat var(--dur,6s) ease-in-out infinite;animation-delay:var(--del,0s);opacity:.12}
.c-star{position:absolute;font-size:14px;animation:twinkle var(--dur,2s) ease-in-out infinite;animation-delay:var(--del,0s);opacity:.2}
.c-wicket{position:absolute;font-size:20px;animation:spinWicket var(--dur,4s) ease-in-out infinite;animation-delay:var(--del,0s);opacity:.1}

@keyframes floatBall{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(180deg)}}
@keyframes floatTrophy{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.08)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(251,191,36,.15)}50%{box-shadow:0 0 40px rgba(251,191,36,.4)}}
.infas-header{animation:glowPulse 3s ease-in-out infinite}
.c-elem{position:absolute;pointer-events:none;font-size:24px;opacity:.15}
.c-ball{animation:floatBall 4s ease-in-out infinite}
.c-trophy{animation:floatTrophy 5s ease-in-out infinite;font-size:28px}
.c-star{animation:twinkle 2s ease-in-out infinite;font-size:14px;opacity:.2}

@keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.ann-banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;animation:fadeInDown .4s ease;position:relative;overflow:hidden}
.ann-urgent{background:linear-gradient(135deg,#450a0a,#7f1d1d);border:1px solid #ef4444}
.ann-info{background:linear-gradient(135deg,#0c1a3a,#1e3a5f);border:1px solid #3b82f6}
.ann-success{background:linear-gradient(135deg,#052e16,#065f46);border:1px solid #4ade80}
.ann-warning{background:linear-gradient(135deg,#1c1003,#451a03);border:1px solid #f59e0b}
.ann-icon{font-size:22px;flex-shrink:0}
.ann-text{flex:1;font-size:13px;font-weight:600;color:#fff;line-height:1.4}
.ann-sub{font-size:11px;font-weight:400;color:rgba(255,255,255,.6);margin-top:2px}
.ann-shine{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shine 3s infinite}
@keyframes shine{0%{left:-100%}100%{left:200%}}

/* PLAYER OF TOURNAMENT */
@keyframes potmGlow{0%,100%{box-shadow:0 0 20px rgba(251,191,36,.3)}50%{box-shadow:0 0 50px rgba(251,191,36,.7),0 0 100px rgba(251,191,36,.2)}}
@keyframes potmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.potm-card{background:linear-gradient(135deg,#1a1200,#2d1f00,#1a0a00);border:2px solid #f59e0b;border-radius:18px;padding:18px 16px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden;animation:potmGlow 3s ease-in-out infinite}
.potm-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(251,191,36,.15),transparent 70%);pointer-events:none}
.potm-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #f59e0b;margin:0 auto 8px;display:block;animation:potmFloat 3s ease-in-out infinite}
.potm-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#000;margin:0 auto 8px;animation:potmFloat 3s ease-in-out infinite}
/* SHARE BUTTON */
.share-btn{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.share-btn:hover{transform:scale(1.04);box-shadow:0 4px 16px rgba(22,163,74,.4)}
/* PUSH NOTIF */
.notif-bar{background:linear-gradient(135deg,#1e3a5f,#0f2540);border:1px solid #3b82f6;border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}

/* ══ VIDEO SECTION ══ */
.video-section{border-radius:16px;overflow:hidden;margin-bottom:14px;position:relative;background:#000;border:1px solid rgba(99,179,237,0.2)}
.video-label{position:absolute;top:10px;left:12px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;z-index:2;display:flex;align-items:center;gap:4px}
.video-label .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
.video-section video{width:100%;height:auto;object-fit:contain;display:block;background:#000}
.video-section iframe{width:100%;height:auto;aspect-ratio:16/9;border:none;display:block}
.video-upload-box{border:2px dashed rgba(99,179,237,0.3);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:rgba(15,37,64,0.4);transition:all .2s}
.video-upload-box:hover{border-color:#3b82f6;background:rgba(59,130,246,0.08)}

/* FAN VOTE */
@keyframes voteGlow{0%,100%{box-shadow:0 0 10px rgba(251,191,36,.2)}50%{box-shadow:0 0 25px rgba(251,191,36,.5)}}
.vote-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:all .2s}
.vote-card:hover{border-color:#f59e0b;transform:translateY(-1px)}
.vote-bar-bg{background:var(--input-bg);border-radius:20px;height:6px;flex:1;overflow:hidden}
.vote-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,#f59e0b,#d97706);transition:width .5s ease}
.vote-btn{border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.vote-btn.voted{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;animation:voteGlow 2s infinite}
.vote-btn.unvoted{background:var(--input-bg);color:var(--text3);border:1px solid var(--border2)}
/* MY STATS */
.mystats-card{background:linear-gradient(135deg,#0a1628,#0d1b4a);border:2px solid #3b82f6;border-radius:18px;padding:20px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.mystats-rank{background:linear-gradient(135deg,#1d4ed8,#1e40af);border-radius:12px;padding:10px;text-align:center}
/* GALLERY */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.gallery-item{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;border:1px solid var(--border)}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gallery-item:hover img{transform:scale(1.08)}
.gallery-fullscreen{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}

/* ══ LIVE SCORING ══ */
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
.live-dot{width:10px;height:10px;border-radius:50%;background:#ef4444;display:inline-block;animation:livePulse 1s infinite;margin-right:6px}
.score-board{background:linear-gradient(135deg,#0a1628,#0d1b4a);border:2px solid #3b82f6;border-radius:18px;padding:20px;margin-bottom:14px;text-align:center;position:relative}
.score-big{font-size:52px;font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.score-over{font-size:16px;color:#60a5fa;margin-top:4px}
.ball-btn{width:52px;height:52px;border-radius:50%;border:none;font-size:16px;font-weight:800;cursor:pointer;transition:all .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.ball-btn:active{transform:scale(.92)}
.ball-0{background:#1e293b;color:#94a3b8}
.ball-1{background:#1e3a5f;color:#60a5fa}
.ball-2{background:#1e3a5f;color:#60a5fa}
.ball-3{background:#0f2e1a;color:#4ade80}
.ball-4{background:#0f2e1a;color:#4ade80}
.ball-6{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff}
.ball-W{background:linear-gradient(135deg,#991b1b,#7f1d1d);color:#fca5a5}
.ball-WD{background:#1c1003;color:#f59e0b}
.ball-NB{background:#1c1003;color:#f59e0b}
.innings-tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border2);font-size:13px;font-weight:600;cursor:pointer;background:var(--input-bg);color:var(--text3);transition:all .2s}
.innings-tab.on{background:linear-gradient(135deg,#1d4ed8,#1e40af);color:#fff;border-color:transparent}
.bat-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--input-bg);border-radius:10px;margin-bottom:6px;border:1px solid var(--border)}
.bat-row.batting{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.bowl-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--input-bg);border-radius:10px;margin-bottom:6px;border:1px solid var(--border)}
.bowl-row.bowling{border-color:#60a5fa;background:rgba(59,130,246,.08)}
.live-user-card{background:linear-gradient(135deg,#0a1628,#0d1b4a);border:2px solid #ef4444;border-radius:16px;padding:16px;margin-bottom:14px}

/* ══ PERFORMANCE ══ */
img{loading:lazy}
.rank1-hero,.potm-card,.ann-banner,.video-section,.big-nav-btn{will-change:transform}
.c-ball,.c-trophy,.c-star{will-change:transform,opacity}
* {-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
</style>

/* ══ UTILITIES ══ */
function timeAgo(ts){
  if(!ts)return'';
  const d=ts.toDate?ts.toDate():new Date(ts);
  const diff=Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60)return'now';
  if(diff<3600)return Math.floor(diff/60)+'m';
  if(diff<86400)return Math.floor(diff/3600)+'h';
  return d.toLocaleDateString();
}
function useFirestore(col,limit){
  const [data,setData]=useState([]);
  useEffect(()=>{
    let q=db.collection(col);
    const unsub=q.onSnapshot(snap=>{
      setData(snap.docs.map(d=>({id:d.id,...d.data()})));
    },{error:e=>console.warn('Firestore error:',col,e)});
    return()=>unsub();
  },[col]);
  return data;
}
function useSettings(){
  const [settings,setSettings]=useState({});
  useEffect(()=>{
    const unsub=db.collection('settings').doc('main').onSnapshot(snap=>{
      if(snap.exists)setSettings(snap.data());
    });
    return()=>unsub();
  },[]);
  return settings;
}
function useTheme(){
  const getAuto=()=>{ const h=new Date().getHours(); return h>=6&&h<18?'light':'dark'; };
  const saved=localStorage.getItem('crix_theme');
  const [isDay,setIsDay]=useState(saved?saved==='light':getAuto()==='light');
  useEffect(()=>{
    document.body.className=isDay?'light-mode':'';
    localStorage.setItem('crix_theme',isDay?'light':'dark');
  },[isDay]);
  return{isDay,toggle:()=>setIsDay(d=>!d)};
}

/* ══ RANKING FUNCTIONS ══ */
function ecoBonus(eco){
  const e=parseFloat(eco)||0;
  if(!e)return 0;
  if(e<10)return 3.0;if(e<11)return 2.5;if(e<12)return 2.25;
  if(e<13)return 2.0;if(e<14)return 1.75;if(e<15)return 1.5;
  return 0;
}
function calcBowlPts(w,eco){return parseFloat(((w||0)*1.25+ecoBonus(eco)).toFixed(2));}
function rankTeams(teams){return[...teams].sort((a,b)=>b.pts-a.pts).map((t,i)=>({...t,rank:i+1}));}
function rankBatsmen(players){return[...players].sort((a,b)=>(b.batPts||0)-(a.batPts||0)).map((p,i)=>({...p,rank:i+1}));}
function rankBowlers(players){return[...players].filter(p=>(p.wickets||0)>0||(p.bowlPts||0)>0).sort((a,b)=>(b.bowlPts||0)-(a.bowlPts||0)).map((p,i)=>({...p,rank:i+1}));}
function rankAllRounders(players){return[...players].filter(p=>(p.runs||0)>0&&(p.wickets||0)>0).sort((a,b)=>((b.batPts||0)+(b.bowlPts||0))-((a.batPts||0)+(a.bowlPts||0))).map((p,i)=>({...p,rank:i+1,totalPts:+((p.batPts||0)+(p.bowlPts||0)).toFixed(2)}));}
function recalcTeamPts(matches,teams){
  const wins={},pts={},champ={},runner={};
  teams.forEach(t=>{wins[t.id]=0;pts[t.id]=0;champ[t.id]=0;runner[t.id]=0;});
  matches.forEach(m=>{
    if(m.winnerId&&wins[m.winnerId]!==undefined){wins[m.winnerId]++;pts[m.winnerId]=parseFloat(((pts[m.winnerId]||0)+1.85).toFixed(2));}
    if(m.isFinal){
      if(m.championId&&champ[m.championId]!==undefined){pts[m.championId]=parseFloat(((pts[m.championId]||0)+20.75).toFixed(2));champ[m.championId]=1;}
      if(m.runnerId&&runner[m.runnerId]!==undefined){pts[m.runnerId]=parseFloat(((pts[m.runnerId]||0)+10.75).toFixed(2));runner[m.runnerId]=1;}
    }
  });
  const batch=db.batch();
  teams.forEach(t=>{
    const ref=db.collection('teams').doc(t.id);
    batch.update(ref,{wins:wins[t.id]||0,losses:matches.filter(m=>m.winnerId&&m.winnerId!==t.id&&(m.team1Id===t.id||m.team2Id===t.id)).length,pts:pts[t.id]||0});
  });
  batch.commit().catch(()=>{});
}

function Mdl({open,onClose,title,children,lg}){
  if(!open)return null;
  return <div className="mdl-bg" onClick={onClose}>
    <div className={`mdl-box${lg?' modal-lg':''}`} onClick={e=>e.stopPropagation()}>
      <div className="mdl-hd">
        <span style={{fontWeight:700,color:'var(--text1)'}}>{title}</span>
        <button onClick={onClose} style={{background:'none',border:'none',color:'var(--text4)',fontSize:18,cursor:'pointer'}}>✕</button>
      </div>
      <div className="mdl-body">{children}</div>
    </div>
  </div>;
}
function RBadge({rank}){
  const colors={1:'linear-gradient(135deg,#f59e0b,#d97706)',2:'linear-gradient(135deg,#94a3b8,#64748b)',3:'linear-gradient(135deg,#b45309,#92400e)'};
  return <span style={{background:colors[rank]||'var(--input-bg)',color:rank<=3?'#000':'var(--text3)',width:24,height:24,borderRadius:'50%',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800}}>{rank}</span>;
}
function PAv({player,size}){
  const s=size||32;
  if(player&&player.photo)return <img src={player.photo} style={{width:s,height:s,borderRadius:'50%',objectFit:'cover',flexShrink:0}} alt={player.name}/>;
  return <div style={{width:s,height:s,borderRadius:'50%',background:'linear-gradient(135deg,#7c3aed,#4c1d95)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:s*0.4,fontWeight:700,color:'#fff',flexShrink:0}}>{(player&&player.name||'?')[0]}</div>;
}
function Hero1({player,color,label,statsKeys,bgImage}){
  if(!player)return null;
  const c=color||{border:'#f59e0b',bg:'linear-gradient(135deg,#1a1200,#2d1f00,#1a0a00)',pts:'linear-gradient(135deg,#f59e0b,#d97706)',ptsTxt:'#000',statV:'#fbbf24',statL:'#92400e',badge:'linear-gradient(135deg,#f59e0b,#d97706)',badgeTxt:'#000'};
  const bgStyle=bgImage
    ?{backgroundImage:'url('+bgImage+')',backgroundSize:'cover',backgroundPosition:'center',backgroundRepeat:'no-repeat'}
    :{background:c.bg};
  return <div className="rank1-hero" style={{borderColor:c.border,...bgStyle}}>
    {bgImage&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.55)',borderRadius:18}}/>}
    <div style={{position:'relative',zIndex:1}}>
      <div className="rank1-badge" style={{background:c.badge,color:c.badgeTxt}}>{label}</div>
      <div style={{fontSize:32,marginBottom:8}}>👑</div>
      {player.photo?<img src={player.photo} className="rank1-photo" style={{borderColor:c.border,boxShadow:'0 0 28px '+c.border+'88'}} alt={player.name}/>:<div className="rank1-avatar" style={{background:c.badge,color:c.badgeTxt}}>{(player.name||'?')[0]}</div>}
      <div className="rank1-name">{player.name}</div>
      <div className="rank1-team" style={{color:bgImage?'#fcd34d':c.statL}}>{player.teamName||'No Team'}</div>
      <div className="rank1-pts" style={{background:c.pts,color:c.ptsTxt}}>{player.showPts} pts</div>
      <div className="rank1-stats">
        {statsKeys.map(([k,l])=><div key={k} className="rank1-stat">
          <div className="rank1-stat-v" style={{color:bgImage?'#fff':c.statV}}>{player[k]||0}</div>
          <div className="rank1-stat-l" style={{color:bgImage?'#fcd34d':c.statL}}>{l}</div>
        </div>)}
      </div>
    </div>
  </div>;
}

function UserChat({user}){
  const [open,setOpen]=useState(false);
  const [msgs,setMsgs]=useState([]);
  const [text,setText]=useState('');
  const [unread,setUnread]=useState(0);
  const bottomRef=useRef(null);
  const chatId='user_'+user.name.replace(/\s+/g,'_').toLowerCase();

  useEffect(()=>{
    const unsub=db.collection('chats').doc(chatId).onSnapshot(snap=>{
      const d=snap.data();
      if(d&&!d.userRead)setUnread(1);else setUnread(0);
    });
    return()=>unsub();
  },[chatId]);

  useEffect(()=>{
    if(!open)return;
    const unsub=db.collection('chats').doc(chatId).collection('messages').orderBy('ts','asc').onSnapshot(snap=>{
      const ms=snap.docs.map(d=>({id:d.id,...d.data()}));
      setMsgs(ms);
      db.collection('chats').doc(chatId).set({userName:user.name,userRead:true},{merge:true});
      if(ms.length===0){
        setTimeout(()=>{
          db.collection('chats').doc(chatId).collection('messages').add({from:'admin',name:'Admin',text:'Hey '+user.name.split(' ')[0]+'! Welcome to CRIX Cricket Rankings! We are thrilled to have you here. Feel free to ask anything!',ts:firebase.firestore.FieldValue.serverTimestamp(),isWelcome:true});
          db.collection('chats').doc(chatId).set({userName:user.name,lastMsg:'Welcome!',lastTs:firebase.firestore.FieldValue.serverTimestamp(),adminRead:true,userRead:true},{merge:true});
        },1000);
      }
    });
    return()=>unsub();
  },[open,chatId]);

  useEffect(()=>{bottomRef.current&&bottomRef.current.scrollIntoView({behavior:'smooth'});},[msgs]);

  const autoReplyTimer=useRef(null);

  const send=()=>{
    if(!text.trim())return;
    const t=text.trim();
    db.collection('chats').doc(chatId).set({userName:user.name,lastMsg:t,lastTs:firebase.firestore.FieldValue.serverTimestamp(),adminRead:false,userRead:true},{merge:true});
    db.collection('chats').doc(chatId).collection('messages').add({from:'user',name:user.name,text:t,ts:firebase.firestore.FieldValue.serverTimestamp()});
    if('Notification' in window&&Notification.permission==='granted'){
      new Notification('New message from '+user.name,{body:t,icon:'https://cdn-icons-png.flaticon.com/512/785/785116.png',tag:'crix-'+chatId,renotify:true});
    }
    setText('');
    // Auto reply after 10 minutes if admin hasn't replied
    if(autoReplyTimer.current)clearTimeout(autoReplyTimer.current);
    autoReplyTimer.current=setTimeout(async()=>{
      // Check if admin replied after user's last message
      try{
        const snap=await db.collection('chats').doc(chatId).collection('messages').orderBy('ts','desc').limit(1).get();
        if(!snap.empty){
          const lastMsg=snap.docs[0].data();
          // Only auto reply if last message is still from user
          if(lastMsg.from==='user'){
            const autoReplies=[
              'Hi '+user.name.split(' ')[0]+'! Thanks for your message. Our admin will get back to you soon! 🏏',
              'Hey '+user.name.split(' ')[0]+'! We received your message. Admin will reply shortly. Thank you for your patience! ⭐',
              'Thanks for contacting CricRank! '+user.name.split(' ')[0]+', our team will respond to you soon. Stay tuned! 🏆',
            ];
            const reply=autoReplies[Math.floor(Math.random()*autoReplies.length)];
            await db.collection('chats').doc(chatId).collection('messages').add({
              from:'admin',name:'Admin',text:reply,
              ts:firebase.firestore.FieldValue.serverTimestamp(),
              isAuto:true
            });
            await db.collection('chats').doc(chatId).set({
              lastMsg:'Admin: '+reply,
              lastTs:firebase.firestore.FieldValue.serverTimestamp(),
              userRead:false,adminRead:true
            },{merge:true});
          }
        }
      }catch(e){}
    },2000); // 2 seconds
  };

  return <>
    {open&&<div className="chat-window">
      <div className="chat-head">
        <span style={{fontSize:20}}>💬</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:13,color:'#fff'}}>Support Chat</div>
          <div style={{fontSize:11,color:'#60a5fa'}}>Ask admin anything</div>
        </div>
        <button onClick={()=>setOpen(false)} style={{background:'none',border:'none',color:'#94a3b8',fontSize:16,cursor:'pointer'}}>✕</button>
      </div>
      <div className="chat-msgs">
        {msgs.length===0&&<div style={{textAlign:'center',padding:'20px',color:'var(--text5)',fontSize:13}}>Loading...</div>}
        {msgs.map(m=><div key={m.id} className={'chat-msg '+(m.from==='user'?'mine':m.isWelcome?'welcome':'theirs')} style={m.isWelcome?{alignSelf:'center',maxWidth:'95%'}:{}}>
          {m.from==='admin'&&!m.isWelcome&&<div className="cm-name">🏏 Admin</div>}
          {m.isWelcome&&<div style={{fontSize:10,fontWeight:700,color:'#4ade80',marginBottom:4}}>🎉 WELCOME</div>}
          <div style={{color:m.isWelcome?'#d1fae5':'inherit'}}>{m.text}</div>
          <div className="cm-time" style={{color:m.from==='user'?'rgba(255,255,255,.5)':m.isWelcome?'rgba(74,222,128,.6)':'var(--text5)'}}>{timeAgo(m.ts)}</div>
        </div>)}
        <div ref={bottomRef}/>
      </div>
      <div className="chat-inp-row">
        <input className="chat-inp" value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Type message..."/>
        <button className="chat-send" onClick={send}>➤</button>
      </div>
    </div>}
    <button className="chat-fab" onClick={()=>setOpen(o=>!o)} style={{position:'fixed',bottom:22,right:22}}>
      {open?'✕':'💬'}
      {!open&&unread>0&&<span className="chat-badge">1</span>}
    </button>
  </>;
}

/* ══ PLAYER REGISTRATION FORM ══ */
function PlayerRegForm({onClose}){
  const [form,setForm]=useState({name:'',club:'',position:'Batsman',phone:'',note:''});
  const [payImg,setPayImg]=useState(null);
  const [profileImg,setProfileImg]=useState(null);
  const [loading,setLoading]=useState(false);
  const [done,setDone]=useState(false);
  const [err,setErr]=useState('');
  const payRef=useRef(null);
  const profileRef=useRef(null);

  const readFile=(file,setter)=>{
    const r=new FileReader();
    r.onload=e=>setter(e.target.result);
    r.readAsDataURL(file);
  };

  const compressImg=(base64,maxW=600,quality=0.7)=>new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const c=document.createElement('canvas');
      c.width=img.width*scale;c.height=img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',quality));
    };
    img.src=base64;
  });

  const submit=async()=>{
    if(!form.name.trim()){setErr('Name required');return;}
    if(!form.club.trim()){setErr('Club/Team required');return;}
    if(!form.phone.trim()){setErr('Phone required');return;}
    if(!profileImg){setErr('Profile photo required');return;}
    if(!payImg){setErr('Payment screenshot required');return;}
    setErr('');setLoading(true);
    try{
      // Compress images before saving to avoid Firestore 1MB limit
      const compressedProfile=await compressImg(profileImg,400,0.7);
      const compressedPay=await compressImg(payImg,600,0.65);
      await db.collection('registrations').add({
        name:form.name.trim(),club:form.club.trim(),
        position:form.position,phone:form.phone.trim(),note:form.note,
        profilePhoto:compressedProfile,paymentProof:compressedPay,
        status:'pending',submittedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      setDone(true);
    }catch(e){
      setErr('Submit failed: '+e.message+'. Check internet and try again.');
    }
    setLoading(false);
  };

  if(done)return <div className="reg-overlay">
    <div className="reg-form-box" style={{textAlign:'center'}}>
      {profileImg&&<img src={profileImg} style={{width:70,height:70,borderRadius:'50%',objectFit:'cover',border:'3px solid #4ade80',display:'block',margin:'0 auto 12px'}} alt="profile"/>}
      <div style={{fontSize:44,marginBottom:8}}>🎉</div>
      <div style={{fontSize:18,fontWeight:800,color:'#4ade80',marginBottom:8}}>Registration Submitted!</div>
      <div style={{fontSize:13,color:'#86efac',lineHeight:1.6,marginBottom:16}}>Thank you, {form.name.split(' ')[0]}! Admin will verify and add you soon! 🏆</div>
      <button className="reg-submit" onClick={onClose}>Continue →</button>
    </div>
  </div>;

  return <div className="reg-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="reg-form-box">
      <div style={{fontSize:16,fontWeight:800,color:'#fff',marginBottom:4,textAlign:'center'}}>🏏 Register as Player</div>
      <div style={{fontSize:12,color:'#60a5fa',marginBottom:16,textAlign:'center'}}>Fill details — Admin will approve you!</div>
      {err&&<div style={{background:'#450a0a',border:'1px solid #ef4444',borderRadius:8,padding:'8px 12px',color:'#fca5a5',fontSize:12,marginBottom:12}}>⚠️ {err}</div>}
      <div className="fg">
        <label className="lbl" style={{color:'#94a3b8'}}>📸 Profile Photo *</label>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div onClick={()=>profileRef.current&&profileRef.current.click()} style={{width:60,height:60,borderRadius:'50%',border:profileImg?'3px solid #4ade80':'2px dashed #3b82f6',background:'rgba(15,37,64,0.6)',cursor:'pointer',overflow:'hidden',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
            {profileImg?<img src={profileImg} style={{width:'100%',height:'100%',objectFit:'cover'}} alt="p"/>:<span style={{fontSize:22}}>👤</span>}
          </div>
          <button type="button" onClick={()=>profileRef.current&&profileRef.current.click()} style={{background:'linear-gradient(135deg,#1d4ed8,#1e40af)',color:'#fff',border:'none',borderRadius:8,padding:'7px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            {profileImg?'Change':'Upload'} 📷
          </button>
        </div>
        <input type="file" ref={profileRef} accept="image/*" style={{display:'none'}} onChange={e=>{if(e.target.files[0])readFile(e.target.files[0],setProfileImg);}}/>
      </div>
      <div className="fg"><label className="lbl" style={{color:'#94a3b8'}}>Full Name *</label><input className="reg-inp" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your full name"/></div>
      <div className="fg"><label className="lbl" style={{color:'#94a3b8'}}>Club / Team *</label><input className="reg-inp" value={form.club} onChange={e=>setForm({...form,club:e.target.value})} placeholder="Your cricket club"/></div>
      <div className="fg"><label className="lbl" style={{color:'#94a3b8'}}>Position *</label>
        <select className="reg-sel" value={form.position} onChange={e=>setForm({...form,position:e.target.value})}>
          <option>Batsman</option><option>Bowler</option><option>All-Rounder</option><option>Wicket Keeper</option><option>Wicket Keeper Batsman</option>
        </select>
      </div>
      <div className="fg"><label className="lbl" style={{color:'#94a3b8'}}>Phone / WhatsApp *</label><input className="reg-inp" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Contact number" type="tel"/>
        <div style={{color:'#475569',fontSize:10,marginTop:3}}>Used to identify same-name players</div>
      </div>
      <div className="fg">
        <label className="lbl" style={{color:'#94a3b8'}}>Payment Screenshot *</label>
        <div className="reg-upload" onClick={()=>payRef.current&&payRef.current.click()}>
          {payImg?<img src={payImg} style={{maxHeight:120,maxWidth:'100%',objectFit:'contain',borderRadius:8}} alt="pay"/>
            :<><div style={{fontSize:26,marginBottom:4}}>💳</div><div style={{color:'#60a5fa',fontSize:12}}>Tap to upload</div></>}
        </div>
        <input type="file" ref={payRef} accept="image/*" style={{display:'none'}} onChange={e=>{if(e.target.files[0])readFile(e.target.files[0],setPayImg);}}/>
      </div>
      <div className="fg"><label className="lbl" style={{color:'#94a3b8'}}>Note</label><input className="reg-inp" value={form.note} onChange={e=>setForm({...form,note:e.target.value})} placeholder="Anything to add..."/></div>
      <button className="reg-submit" onClick={submit} disabled={loading}>{loading?'Submitting...':'Submit Registration 🚀'}</button>
      <button type="button" className="reg-cancel" onClick={onClose}>← Cancel</button>
    </div>
  </div>;
}

function AdminRegistrations(){
  const regs=useFirestore('registrations');

    if(!window.confirm('Approve '+reg.name+' and add as player?'))return;
    await db.collection('players').add({name:reg.name,teamName:reg.club,role:reg.position,phone:reg.phone||'',photo:reg.profilePhoto||null,runs:0,innings:0,avg:0,sr:0,fifties:0,hundreds:0,batPts:0,wickets:0,economy:0,bowlPts:0,_createdAt:Date.now()});
    await db.collection('registrations').doc(reg.id).set({status:'approved',approvedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    showToast(reg.name+' approved! Added as player.');
  };

  const reject=async(reg)=>{
    if(!window.confirm('Reject '+reg.name+'?'))return;
    await db.collection('registrations').doc(reg.id).set({status:'rejected'},{merge:true});

        <div style={{fontSize:11,color:'var(--text5)',marginBottom:2}}>{r.club} | {r.position}</div>
        <div style={{fontSize:11,color:'var(--text5)'}}>{r.phone}</div>
        {r.note&&<div style={{fontSize:11,color:'var(--text5)'}}>{r.note}</div>}

      </div>
      {r.status==='pending'&&<div style={{display:'flex',flexDirection:'column',gap:4}}>
        <button className="btn bs1" style={{fontSize:11,padding:'4px 8px',background:'linear-gradient(135deg,#16a34a,#15803d)'}} onClick={()=>approve(r)}>✅</button>

      </div>}
    </div>)}
    {viewImg&&<div className="reg-overlay" onClick={()=>setViewImg(null)}>

        <button style={{width:'100%',marginTop:10,background:'#1e293b',border:'none',color:'#94a3b8',borderRadius:10,padding:10,cursor:'pointer'}} onClick={()=>setViewImg(null)}>Close</button>
      </div>
    </div>}

function AdminTeams({teams,setTeams,matches}){
  const [form,setForm]=useState({name:'',shortName:'',color:'#1d4ed8',homeGround:''});

    if(!form.name.trim()){showToast('Team name required','err');return;}

      await db.collection('teams').doc(edit.id).set(data,{merge:true});

      await db.collection('teams').add(data);
      showToast('Team added!');
    }
    setForm({name:'',shortName:'',color:'#1d4ed8',homeGround:''});setLogo(null);setEdit(null);

    if(!window.confirm('"'+nm+'" delete?'))return;
    await db.collection('teams').doc(id).delete();
    showToast('Deleted!');
  };

  const startEdit=(t)=>{setEdit(t);setForm({name:t.name||'',shortName:t.shortName||'',color:t.color||'#1d4ed8',homeGround:t.homeGround||''});setLogo(t.logo||null);};

  const addPts=async(bonus)=>{
    if(!ptsModal)return;
    const cur=ptsModal.pts||0;
    await db.collection('teams').doc(ptsModal.id).set({pts:parseFloat((cur+bonus).toFixed(2))},{merge:true});

  </div>;
}

/* ══ ADMIN MATCHES ══ */
function AdminMatches({matches,setMatches,teams,players}){
  const [form,setForm]=useState({team1Id:'',team2Id:'',date:'',venue:'',status:'upcoming',winnerId:'',isFinal:false,championId:'',runnerId:''});
  const [edit,setEdit]=useState(null);

  const save=async()=>{
    if(!form.team1Id||!form.team2Id){showToast('Select both teams','err');return;}
    if(form.team1Id===form.team2Id){showToast('Teams must be different','err');return;}
    const t1=teams.find(t=>t.id===form.team1Id);
    const t2=teams.find(t=>t.id===form.team2Id);
    const winner=teams.find(t=>t.id===form.winnerId);
    const data={...form,team1Name:t1?t1.name:'',team2Name:t2?t2.name:'',winnerName:winner?winner.name:''};
    if(edit){
      await db.collection('matches').doc(edit.id).set(data,{merge:true});
      showToast('Match updated!');
    }else{
      await db.collection('matches').add(data);
      showToast('Match added!');
    }
    recalcTeamPts([...matches,data],teams);
    setForm({team1Id:'',team2Id:'',date:'',venue:'',status:'upcoming',winnerId:'',isFinal:false,championId:'',runnerId:''});
    setEdit(null);
  };

  const del=async(id)=>{
    if(!window.confirm('Delete match?'))return;
    await db.collection('matches').doc(id).delete();
    const remaining=matches.filter(m=>m.id!==id);
    recalcTeamPts(remaining,teams);
    showToast('Deleted!');
  };

  return <div>
    <div className="sec-h"><div className="sec-t">⚡ Matches</div><div style={{color:'var(--text4)',fontSize:13}}>{matches.length} matches</div></div>
    <div className="card">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div className="fg"><label className="lbl">Team 1</label><select className="sel" value={form.team1Id} onChange={e=>setForm({...form,team1Id:e.target.value})}><option value="">Select</option>{teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div>

        <label htmlFor="isFinal" style={{color:'var(--text2)',fontSize:13,cursor:'pointer'}}>🏆 Final Match</label>
      </div>
      {form.isFinal&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
        <div className="fg"><label className="lbl">Champion</label><select className="sel" value={form.championId} onChange={e=>setForm({...form,championId:e.target.value})}><option value="">Select</option>{teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
        <div className="fg"><label className="lbl">Runner-up</label><select className="sel" value={form.runnerId} onChange={e=>setForm({...form,runnerId:e.target.value})}><option value="">Select</option>{teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
      </div>}
      <div style={{display:'flex',gap:8}}>
        <button className="btn bs1" onClick={save}>{edit?'Update':'Add'} Match</button>
        {edit&&<button className="btn bs2" onClick={()=>{setEdit(null);setForm({team1Id:'',team2Id:'',date:'',venue:'',status:'upcoming',winnerId:'',isFinal:false,championId:'',runnerId:''});}}>Cancel</button>}
      </div>
    </div>
    {[...matches].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(m=><div key={m.id} className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontWeight:700,color:'var(--text1)',fontSize:14}}>{m.team1Name} vs {m.team2Name}</div>
          <div style={{fontSize:12,color:'var(--text4)',marginTop:2}}>{m.date} {m.venue&&'| '+m.venue}</div>
          {m.winnerName&&<div style={{fontSize:12,color:'#4ade80',marginTop:2}}>🏆 {m.winnerName}</div>}
          {m.isFinal&&<span className="badge bo" style={{marginTop:4}}>FINAL</span>}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <span className={'badge '+(m.status==='live'?'br':m.status==='completed'?'bg':'bb')}>{m.status==='live'&&<span className="pulse"/>}{m.status}</span>
          <button className="btn bs2" style={{fontSize:11}} onClick={()=>{setEdit(m);setForm({team1Id:m.team1Id||'',team2Id:m.team2Id||'',date:m.date||'',venue:m.venue||'',status:m.status||'upcoming',winnerId:m.winnerId||'',isFinal:m.isFinal||false,championId:m.championId||'',runnerId:m.runnerId||''});}}>✏️</button>
          <button className="btn" style={{fontSize:11,background:'rgba(239,68,68,.15)',color:'#ef4444',border:'1px solid rgba(239,68,68,.3)'}} onClick={()=>del(m.id)}>🗑️</button>
        </div>
      </div>
    </div>)}
  </div>;
}

/* ══ ADMIN RANKINGS ══ */
function AdminRankings({teams,players,setPlayers}){
  const [tab,setTab]=useState('teams');
  const teamRanked=rankTeams(teams);
  const batRanked=rankBatsmen(players);
  const bowlRanked=rankBowlers(players);
  const arRanked=rankAllRounders(players);

  const updateCell=async(pid,field,val)=>{
    const num=parseFloat(val)||0;
    const player=players.find(p=>p.id===pid);
    if(!player)return;
    const upd={[field]:num};
    if(field==='runs'||field==='wickets'||field==='economy'){
      const runs=field==='runs'?num:(player.runs||0);
      const wickets=field==='wickets'?num:(player.wickets||0);
      const eco=field==='economy'?num:(player.economy||0);
      upd.batPts=parseFloat((runs*0.75).toFixed(2));
      upd.bowlPts=calcBowlPts(wickets,eco);
    }
    await db.collection('players').doc(pid).set(upd,{merge:true});
    showToast('Updated!');
  };

  return <div>
    <div className="sec-h"><div className="sec-t">📊 Rankings</div></div>
    <div className="tabs">{[['teams','🛡️ Teams'],['batting','⭐ Batting'],['bowling','🎯 Bowling'],['allround','🏏 All-Rounders']].map(([id,l])=><button key={id} className={'tab'+(tab===id?' on':'')} onClick={()=>setTab(id)} dangerouslySetInnerHTML={{__html:l}}/>)}</div>
    {tab==='teams'&&<div className="card"><div className="ovx"><table className="table">
      <thead><tr><th>#</th><th>Team</th><th className="tc">W</th><th className="tc">L</th><th className="tc">Pts</th></tr></thead>
      <tbody>{teamRanked.map(t=><tr key={t.id}><td><RBadge rank={t.rank}/></td><td><div style={{display:'flex',alignItems:'center',gap:8}}>{t.logo?<img src={t.logo} style={{width:24,height:24,borderRadius:'50%',objectFit:'cover'}} alt={t.name}/>:<div style={{width:24,height:24,borderRadius:'50%',background:t.color||'#1d4ed8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff'}}>{(t.name||'?')[0]}</div>}<span style={{fontWeight:600,color:'var(--text2)',fontSize:13}}>{t.name}</span></div></td>
      <td className="tc" style={{color:'#4ade80',fontWeight:700}}>{t.wins||0}</td><td className="tc" style={{color:'#ef4444'}}>{t.losses||0}</td><td className="tc"><span style={{fontWeight:800,color:'#fbbf24'}}>{t.pts||0}</span></td></tr>)}
      </tbody></table></div></div>}
    {tab==='batting'&&<div className="card"><div className="ovx"><table className="table">
      <thead><tr><th>#</th><th>Player</th><th className="tc">Runs</th><th className="tc">Wkts</th><th className="tc">Eco</th><th className="tc">Bat Pts</th><th className="tc">Bowl Pts</th></tr></thead>
      <tbody>{batRanked.map(p=><tr key={p.id}><td><RBadge rank={p.rank}/></td>
        <td><div style={{display:'flex',alignItems:'center',gap:8}}><PAv player={p} size={24}/><div><div style={{fontWeight:600,color:'var(--text2)',fontSize:13}}>{p.name}</div><div style={{fontSize:11,color:'var(--text4)'}}>{p.teamName}</div></div></div></td>
        {[['runs','#f59e0b'],['wickets','#60a5fa'],['economy','#94a3b8']].map(([f,c])=><td key={f} className="tc"><input style={{width:54,background:'transparent',border:'none',color:c,fontWeight:700,textAlign:'center',fontSize:13,cursor:'text',outline:'none'}} defaultValue={p[f]||0} onBlur={e=>updateCell(p.id,f,e.target.value)} onKeyDown={e=>{if(e.key==='Enter')e.target.blur();if(e.key==='Escape')e.target.value=p[f]||0;}}/></td>)}
        <td className="tc" style={{color:'#fbbf24',fontWeight:700}}>{p.batPts||0}</td>
        <td className="tc" style={{color:'#fbbf24',fontWeight:700}}>{p.bowlPts||0}</td>
      </tr>)}</tbody></table></div></div>}
    {tab==='bowling'&&<div className="card"><div className="ovx"><table className="table">
      <thead><tr><th>#</th><th>Player</th><th className="tc">Wickets</th><th className="tc">Economy</th><th className="tc">Bowl Pts</th></tr></thead>
      <tbody>{bowlRanked.map(p=><tr key={p.id}><td><RBadge rank={p.rank}/></td>
        <td><div style={{display:'flex',alignItems:'center',gap:8}}><PAv player={p} size={24}/><div><div style={{fontWeight:600,color:'var(--text2)',fontSize:13}}>{p.name}</div><div style={{fontSize:11,color:'var(--text4)'}}>{p.teamName}</div></div></div></td>
        <td className="tc" style={{color:'#60a5fa',fontWeight:700}}>{p.wickets||0}</td>
        <td className="tc" style={{color:'#94a3b8'}}>{p.economy||'—'}</td>
        <td className="tc"><span style={{fontWeight:800,color:'#fbbf24'}}>{p.bowlPts||0}</span></td>
      </tr>)}</tbody></table></div></div>}
    {tab==='allround'&&<div className="card"><div className="ovx"><table className="table">
      <thead><tr><th>#</th><th>Player</th><th className="tc">Runs</th><th className="tc">Wkts</th><th className="tc">Total Pts</th></tr></thead>
      <tbody>{arRanked.map(p=><tr key={p.id}><td><RBadge rank={p.rank}/></td>
        <td><div style={{display:'flex',alignItems:'center',gap:8}}><PAv player={p} size={24}/><div><div style={{fontWeight:600,color:'var(--text2)',fontSize:13}}>{p.name}</div><div style={{fontSize:11,color:'var(--text4)'}}>{p.teamName}</div></div></div></td>
        <td className="tc" style={{color:'#f59e0b',fontWeight:700}}>{p.runs||0}</td>
        <td className="tc" style={{color:'#60a5fa',fontWeight:700}}>{p.wickets||0}</td>
        <td className="tc"><span style={{fontWeight:800,color:'#fbbf24'}}>{p.totalPts}</span></td>
      </tr>)}</tbody></table></div></div>}
  </div>;
}

/* ══ USER VIDEO SECTION ══ */
function VideoSection({settings}){
  if(!settings||!settings.videoActive)return null;
  if(!settings.videoData&&!settings.videoUrl)return null;
  const getYtId=(url)=>{
    const m=(url||'').match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|.*[?&]v=))([^"&?/\s]{11})/);
    return m?m[1]:null;
  };
  const ytId=getYtId(settings.videoUrl);
  return <div className="video-section">
    <div className="video-label"><span className="dot"/>{settings.videoLabel||'🎬 Highlights'}</div>
    {settings.videoType==='upload'&&settings.videoUrl&&
      <video src={settings.videoUrl} controls autoPlay muted loop playsInline style={{width:'100%',height:'auto',display:'block',background:'#000'}}/>}
    {settings.videoType==='youtube'&&ytId&&
      <iframe src={'https://www.youtube.com/embed/'+ytId+'?autoplay=1&mute=1&loop=1&playlist='+ytId} style={{width:'100%',aspectRatio:'16/9',border:'none',display:'block'}} allowFullScreen allow="autoplay"/>}
    {settings.videoType==='link'&&settings.videoUrl&&
      <video src={settings.videoUrl} controls autoPlay muted loop playsInline style={{width:'100%',height:'auto',display:'block',background:'#000'}}/>}
  </div>;
}

/* ══ LIVE SCORING SYSTEM ══ */
function LiveScoring({teams,players,matches}){
  const [selMatch,setSelMatch]=useState(null);
  const [liveData,setLiveData]=useState(null);
  const [innings,setInnings]=useState(1);
  const [striker,setStriker]=useState('');
  const [nonStriker,setNonStriker]=useState('');
  const [bowler,setBowler]=useState('');
  const [loading,setLoading]=useState(false);

  // Load live match data
  useEffect(()=>{
    if(!selMatch)return;
    const unsub=db.collection('livescores').doc(selMatch.id).onSnapshot(snap=>{
      if(snap.exists)setLiveData(snap.data());
      else setLiveData(null);
    });
    return()=>unsub();
  },[selMatch]);

  const startMatch=async()=>{
    if(!selMatch)return;
    const init={
      matchId:selMatch.id,
      team1Name:selMatch.team1Name,team2Name:selMatch.team2Name,
      team1Id:selMatch.team1Id,team2Id:selMatch.team2Id,
      innings1:{runs:0,wickets:0,balls:0,overs:'0.0',batsmen:{},bowlers:{},ballLog:[]},
      innings2:{runs:0,wickets:0,balls:0,overs:'0.0',batsmen:{},bowlers:{},ballLog:[]},
      currentInnings:1,status:'live',
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection('livescores').doc(selMatch.id).set(init);
    // Mark match as live
    await db.collection('matches').doc(selMatch.id).set({status:'live'},{merge:true});
    showToast('Match started! 🔴 LIVE');
  };

  const recordBall=async(event)=>{
    if(!liveData||!striker||!bowler){showToast('Select striker & bowler first','err');return;}
    setLoading(true);
    try{
      const inn=innings===1?'innings1':'innings2';
      const cur=liveData[inn];
      let runs=0,isWicket=false,isExtra=false,extraRuns=0;

      if(event==='0')runs=0;
      else if(event==='1')runs=1;
      else if(event==='2')runs=2;
      else if(event==='3')runs=3;
      else if(event==='4'){runs=4;}
      else if(event==='6'){runs=6;}
      else if(event==='W'){isWicket=true;}
      else if(event==='WD'){isExtra=true;extraRuns=1;}
      else if(event==='NB'){isExtra=true;extraRuns=1;}

      // Update batsman stats
      const batsmen={...cur.batsmen};
      if(!batsmen[striker])batsmen[striker]={runs:0,balls:0,fours:0,sixes:0,out:false};
      if(!isExtra){
        batsmen[striker].runs+=runs;
        batsmen[striker].balls+=1;
        if(runs===4)batsmen[striker].fours+=1;
        if(runs===6)batsmen[striker].sixes+=1;
        if(isWicket)batsmen[striker].out=true;
      }

      // Update bowler stats
      const bowlers={...cur.bowlers};
      if(!bowlers[bowler])bowlers[bowler]={wickets:0,balls:0,runs:0};
      if(!isExtra){
        bowlers[bowler].balls+=1;
        bowlers[bowler].runs+=runs;
        if(isWicket)bowlers[bowler].wickets+=1;
      }else{
        bowlers[bowler].runs+=extraRuns;
      }

      // Update score
      const newRuns=cur.runs+runs+(isExtra?extraRuns:0);
      const newWickets=cur.wickets+(isWicket?1:0);
      const newBalls=cur.balls+(isExtra?0:1);
      const overs=Math.floor(newBalls/6)+'.'+(newBalls%6);

      // Ball log
      const ballLog=[...(cur.ballLog||[]),{event,runs,isWicket,isExtra,striker,bowler,ts:Date.now()}];

      const update={
        [`${inn}.runs`]:newRuns,
        [`${inn}.wickets`]:newWickets,
        [`${inn}.balls`]:newBalls,
        [`${inn}.overs`]:overs,
        [`${inn}.batsmen`]:batsmen,
        [`${inn}.bowlers`]:bowlers,
        [`${inn}.ballLog`]:ballLog,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      };
      await db.collection('livescores').doc(selMatch.id).update(update);

      // Auto update player stats in Firebase after each over
      if(newBalls%6===0){await syncPlayerStats(batsmen,bowlers,newBalls);}

      if(isWicket)setStriker('');
    }catch(e){showToast('Error: '+e.message,'err');}
    setLoading(false);
  };

  const syncPlayerStats=async(batsmen,bowlers,balls)=>{
    const batch=db.batch();
    // Sync batsman stats
    for(const [name,stats] of Object.entries(batsmen)){
      const p=players.find(x=>x.name===name);
      if(p){
        const batPts=parseFloat((stats.runs*0.75).toFixed(2));
        batch.set(db.collection('players').doc(p.id),{
          runs:stats.runs,batPts,innings:(p.innings||0)+1
        },{merge:true});
      }
    }
    // Sync bowler stats
    for(const [name,stats] of Object.entries(bowlers)){
      const p=players.find(x=>x.name===name);
      if(p){
        const overs=stats.balls/6;
        const eco=overs>0?parseFloat((stats.runs/overs).toFixed(2)):0;
        const bowlPts=calcBowlPts(stats.wickets,eco);
        batch.set(db.collection('players').doc(p.id),{
          wickets:stats.wickets,economy:eco,bowlPts
        },{merge:true});
      }
    }
    await batch.commit();
  };

  const endInnings=async()=>{
    if(innings===1){
      setInnings(2);setStriker('');setNonStriker('');setBowler('');
      await db.collection('livescores').doc(selMatch.id).update({currentInnings:2});
      showToast('Innings 2 started!');
    }else{
      // End match
      const inn1=liveData.innings1;const inn2=liveData.innings2;
      const t1Won=inn1.runs>inn2.runs;
      const winnerId=t1Won?selMatch.team1Id:selMatch.team2Id;
      const winnerName=t1Won?selMatch.team1Name:selMatch.team2Name;
      await db.collection('matches').doc(selMatch.id).set({status:'completed',winnerId,winnerName},{merge:true});
      await db.collection('livescores').doc(selMatch.id).update({status:'completed'});
      // Final sync
      await syncPlayerStats({...liveData.innings1.batsmen,...liveData.innings2.batsmen},{...liveData.innings1.bowlers,...liveData.innings2.bowlers},liveData.innings1.balls+liveData.innings2.balls);
      showToast('Match ended! Stats synced! 🏆');
      setSelMatch(null);setLiveData(null);
    }
  };

  const cur=liveData?liveData[innings===1?'innings1':'innings2']:null;
  const battingTeam=innings===1?selMatch?.team1Name:selMatch?.team2Name;
  const battingPlayers=players.filter(p=>p.teamName===battingTeam);
  const bowlingTeam=innings===1?selMatch?.team2Name:selMatch?.team1Name;
  const bowlingPlayers=players.filter(p=>p.teamName===bowlingTeam);

  if(!selMatch)return <div>
    <div className="sec-h"><div><div className="sec-t">🔴 Live Scoring</div><div className="sec-s">Select a match to score</div></div></div>
    {matches.filter(m=>m.status!=='completed').map(m=><div key={m.id} className="card" style={{cursor:'pointer',display:'flex',alignItems:'center',gap:12}} onClick={()=>setSelMatch(m)}>
      <div style={{flex:1}}>
        <div style={{fontWeight:700,color:'var(--text1)'}}>{m.team1Name} vs {m.team2Name}</div>
        <div style={{fontSize:12,color:'var(--text4)',marginTop:2}}>{m.date} {m.venue&&'• '+m.venue}</div>
      </div>
      <span className={'badge '+(m.status==='live'?'br':'bb')}>{m.status==='live'&&<span className="live-dot"/>}{m.status}</span>
    </div>)}
    {matches.filter(m=>m.status!=='completed').length===0&&<div style={{textAlign:'center',padding:40,color:'var(--text5)'}}>No upcoming matches. Add matches first!</div>}
  </div>;

  return <div>
    <div className="sec-h">
      <div><div className="sec-t"><span className="live-dot"/>LIVE: {selMatch.team1Name} vs {selMatch.team2Name}</div></div>
      <button className="btn bs2" onClick={()=>setSelMatch(null)}>← Back</button>
    </div>

    {!liveData?<div className="card" style={{textAlign:'center',padding:30}}>
      <div style={{fontSize:40,marginBottom:12}}>🏏</div>
      <div style={{fontWeight:700,color:'var(--text1)',marginBottom:16}}>Start Live Scoring?</div>
      <button className="btn bs1" style={{background:'linear-gradient(135deg,#ef4444,#dc2626)'}} onClick={startMatch}>🔴 Start Match</button>
    </div>:<>
      {/* Innings tabs */}
      <div style={{display:'flex',gap:8,marginBottom:14}}>
        <button className={'innings-tab'+(innings===1?' on':'')} onClick={()=>setInnings(1)}>1st Innings — {liveData.innings1.runs}/{liveData.innings1.wickets}</button>
        <button className={'innings-tab'+(innings===2?' on':'')} onClick={()=>setInnings(2)}>2nd Innings — {liveData.innings2.runs}/{liveData.innings2.wickets}</button>
      </div>

      {/* Scoreboard */}
      {cur&&<div className="score-board">
        <div style={{fontSize:12,color:'#60a5fa',marginBottom:8}}>{battingTeam} batting</div>
        <div className="score-big">{cur.runs}/{cur.wickets}</div>
        <div className="score-over">Overs: {cur.overs}</div>
        {/* Last 6 balls */}
        {cur.ballLog&&cur.ballLog.length>0&&<div style={{display:'flex',gap:6,justifyContent:'center',marginTop:12,flexWrap:'wrap'}}>
          {cur.ballLog.slice(-6).map((b,i)=><div key={i} style={{width:32,height:32,borderRadius:'50%',background:b.event==='6'?'#7c3aed':b.event==='4'?'#16a34a':b.isWicket?'#dc2626':b.isExtra?'#d97706':'#1e293b',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:'#fff'}}>{b.event}</div>)}
        </div>}
      </div>}

      {/* Select batsmen */}
      <div className="card">
        <div style={{fontWeight:700,color:'var(--text2)',marginBottom:10,fontSize:13}}>🏏 Batsmen</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
          <div><label className="lbl">Striker *</label>
            <select className="sel" value={striker} onChange={e=>setStriker(e.target.value)}>
              <option value="">Select</option>
              {battingPlayers.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
            </select>
          </div>
          <div><label className="lbl">Non-Striker</label>
            <select className="sel" value={nonStriker} onChange={e=>setNonStriker(e.target.value)}>
              <option value="">Select</option>
              {battingPlayers.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
            </select>
          </div>
        </div>
        <div><label className="lbl">Bowler *</label>
          <select className="sel" value={bowler} onChange={e=>setBowler(e.target.value)}>
            <option value="">Select</option>
            {bowlingPlayers.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
          </select>
        </div>
      </div>

      {/* Ball buttons */}
      <div className="card">
        <div style={{fontWeight:700,color:'var(--text2)',marginBottom:12,fontSize:13}}>Record Ball</div>
        <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginBottom:12}}>
          {['0','1','2','3','4','6','W','WD','NB'].map(b=><button key={b} className={'ball-btn ball-'+b} onClick={()=>recordBall(b)} disabled={loading}>{b}</button>)}

}

/* ══ USER: LIVE SCORE VIEW ══ */
function UserLiveScore({matches}){
  const [liveScores,setLiveScores]=useState({});
  const liveMatches=matches.filter(m=>m.status==='live');

  useEffect(()=>{
    if(liveMatches.length===0)return;
    const unsubs=liveMatches.map(m=>
      db.collection('livescores').doc(m.id).onSnapshot(snap=>{
        if(snap.exists)setLiveScores(prev=>({...prev,[m.id]:snap.data()}));
      })
    );
    return()=>unsubs.forEach(u=>u());
  },[liveMatches.length]);

  if(liveMatches.length===0)return null;

  return <div>
    {liveMatches.map(m=>{
      const score=liveScores[m.id];
      const inn=score?.currentInnings===2?score?.innings2:score?.innings1;
      const batting=score?.currentInnings===2?m.team2Name:m.team1Name;
      return <div key={m.id} className="live-user-card">
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <span className="live-dot"/><span style={{fontWeight:800,color:'#ef4444',fontSize:12}}>LIVE</span>
          <span style={{color:'var(--text3)',fontSize:12}}>{m.team1Name} vs {m.team2Name}</span>
        </div>
        {inn?<>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:36,fontWeight:900,color:'#fff'}}>{inn.runs}/{inn.wickets}</div>
            <div style={{fontSize:13,color:'#60a5fa'}}>Overs: {inn.overs} • {batting} batting</div>
          </div>
          {/* Last 6 balls */}
          {inn.ballLog&&inn.ballLog.length>0&&<div style={{display:'flex',gap:6,justifyContent:'center',marginTop:10,flexWrap:'wrap'}}>
            {inn.ballLog.slice(-6).map((b,i)=><div key={i} style={{width:28,height:28,borderRadius:'50%',background:b.event==='6'?'#7c3aed':b.event==='4'?'#16a34a':b.isWicket?'#dc2626':b.isExtra?'#d97706':'#1e293b',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#fff'}}>{b.event}</div>)}
          </div>}
          {score?.innings1&&score?.currentInnings===2&&<div style={{marginTop:8,fontSize:12,color:'var(--text4)',textAlign:'center'}}>
            {m.team1Name}: {score.innings1.runs}/{score.innings1.wickets} ({score.innings1.overs} ov)
          </div>}
        </>:<div style={{textAlign:'center',color:'var(--text5)',fontSize:13}}>Match starting soon...</div>}
      </div>;
    })}
  </div>;
}

/* ══ FAN FAVOURITE VOTE ══ */
function FanVote({players,user}){
  const [votes,setVotes]=useState({});
  const [myVote,setMyVote]=useState(null);
  const [loading,setLoading]=useState(false);
  const voteKey='fanvote_'+user.name.replace(/\s+/g,'_').toLowerCase();

  useEffect(()=>{
    const unsub=db.collection('fanvotes').onSnapshot(snap=>{
      const v={};
      snap.docs.forEach(d=>{v[d.id]=d.data().count||0;});
      setVotes(v);
    });
    // Get my vote from localStorage
    const saved=localStorage.getItem(voteKey);
    if(saved)setMyVote(saved);
    return()=>unsub();
  },[]);

  const vote=async(playerId)=>{
    if(myVote){showToast('You already voted! ⭐');return;}
    setLoading(true);
    try{
      await db.collection('fanvotes').doc(playerId).set({count:firebase.firestore.FieldValue.increment(1)},{merge:true});
      setMyVote(playerId);
      localStorage.setItem(voteKey,playerId);
      showToast('Vote cast! ⭐');
    }catch(e){showToast('Failed','err');}
    setLoading(false);
  };

  const totalVotes=Object.values(votes).reduce((a,b)=>a+b,0);
  const sorted=[...players].sort((a,b)=>(votes[b.id]||0)-(votes[a.id]||0)).slice(0,8);

  return <div>
    <div className="sec-h">
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <button className="btn bs2 bsm" onClick={()=>{}}>← Back</button>
        <div><div className="sec-t">⭐ Fan Favourite</div><div className="sec-s">{totalVotes} votes cast {myVote?'• You voted!':''}</div></div>
      </div>
    </div>
    {!myVote&&<div style={{background:'linear-gradient(135deg,#1c1003,#451a03)',border:'1px solid #f59e0b',borderRadius:12,padding:'12px 16px',marginBottom:14,fontSize:13,color:'#fcd34d',textAlign:'center'}}>
      ⭐ Vote for your favourite player — one vote per person!
    </div>}
    {sorted.map((p,i)=>{
      const pVotes=votes[p.id]||0;
      const pct=totalVotes>0?Math.round(pVotes/totalVotes*100):0;
      const isVoted=myVote===p.id;
      return <div key={p.id} className="vote-card" style={isVoted?{borderColor:'#f59e0b',background:'rgba(251,191,36,0.05)'}:{}}>
        <div style={{fontSize:18,fontWeight:800,color:i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#b45309':'var(--text4)',width:24,textAlign:'center',flexShrink:0}}>{i+1}</div>
        <div style={{position:'relative',flexShrink:0}}>
          {p.photo?<img src={p.photo} loading='lazy' style={{width:44,height:44,borderRadius:'50%',objectFit:'cover',border:'2px solid '+(isVoted?'#f59e0b':'var(--border2)')}} alt={p.name}/>
            :<div style={{width:44,height:44,borderRadius:'50%',background:'linear-gradient(135deg,#7c3aed,#4c1d95)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,fontWeight:700,color:'#fff'}}>{(p.name||'?')[0]}</div>}
          {isVoted&&<div style={{position:'absolute',bottom:-2,right:-2,background:'#f59e0b',borderRadius:'50%',width:16,height:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9}}>⭐</div>}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,color:'var(--text1)',fontSize:13,marginBottom:2}}>{p.name} {isVoted&&<span style={{color:'#f59e0b',fontSize:11}}>← Your vote</span>}</div>
          <div style={{fontSize:11,color:'var(--text4)',marginBottom:4}}>{p.teamName||''} • {p.role||''}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="vote-bar-bg"><div className="vote-bar" style={{width:pct+'%'}}/></div>
            <span style={{fontSize:11,color:'#f59e0b',fontWeight:700,flexShrink:0}}>{pVotes} votes ({pct}%)</span>
          </div>
        </div>
        {!myVote&&<button className="vote-btn unvoted" onClick={()=>vote(p.id)} disabled={loading}>Vote ⭐</button>}
      </div>;
    })}
  </div>;
}

/* ══ ADMIN GALLERY ══ */
function AdminGallery({teams}){
  const [selTeam,setSelTeam]=useState(null);
  const [photos,setPhotos]=useState([]);
  const [uploading,setUploading]=useState(false);
  const [progress,setProgress]=useState('');
  const fileRef=React.useRef(null);

  useEffect(()=>{
    if(!selTeam)return;
    // Each photo is a separate document to avoid 1MB Firestore limit
    const unsub=db.collection('gallery').where('teamId','==',selTeam.id)
      .onSnapshot(snap=>{
        const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
        // Sort by createdAt client-side — no composite index needed
        docs.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
        setPhotos(docs);
      });
    return()=>unsub();
  },[selTeam]);

  const upload=async(files)=>{
    setUploading(true);
    let done=0;
    for(const file of files){
      // Resize image before storing to keep size small
      const resized=await resizeImage(file,800);
      setProgress((done+1)+'/'+files.length+' uploading...');
      await db.collection('gallery').add({
        teamId:selTeam.id,
        teamName:selTeam.name,
        photo:resized,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      done++;
    }
    showToast(done+' photos added! 📸');
    setUploading(false);
    setProgress('');
  };

  const resizeImage=(file,maxWidth)=>{
    return new Promise(res=>{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=()=>{
        const scale=Math.min(1,maxWidth/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*scale;
        canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        URL.revokeObjectURL(url);
        res(canvas.toDataURL('image/jpeg',0.75));
      };
      img.src=url;
    });
  };

  const delPhoto=async(photoId)=>{
    if(!window.confirm('Delete this photo?'))return;
    await db.collection('gallery').doc(photoId).delete();
    showToast('Photo deleted!');
  };

  if(selTeam)return <div>
    <div className="sec-h">
      <div><div className="sec-t">📸 {selTeam.name}</div><div className="sec-s">{photos.length} photos</div></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn bs1" onClick={()=>fileRef.current&&fileRef.current.click()} disabled={uploading}>
          {uploading?progress||'Uploading...':'📷 Add Photos'}
        </button>
        <button className="btn bs2" onClick={()=>setSelTeam(null)}>← Back</button>
      </div>
    </div>
    <input type="file" ref={fileRef} accept="image/*" multiple style={{display:'none'}} onChange={e=>{if(e.target.files.length)upload(Array.from(e.target.files));}}/>
    {photos.length===0&&<div className="card" style={{textAlign:'center',padding:40,color:'var(--text5)'}}>
      <div style={{fontSize:40,marginBottom:10}}>📸</div>
      <div style={{color:'var(--text1)',fontWeight:700,marginBottom:6}}>No photos yet</div>
      <div style={{color:'var(--text5)',fontSize:12}}>Click Add Photos to upload</div>
    </div>}
    <div className="gallery-grid">
      {photos.map(p=><div key={p.id} className="gallery-item">
        <img src={p.photo} alt="gallery"/>
        <button onClick={()=>delPhoto(p.id)} style={{position:'absolute',top:4,right:4,background:'rgba(239,68,68,.85)',border:'none',color:'#fff',borderRadius:'50%',width:22,height:22,fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
      </div>)}
    </div>
  </div>;

  return <div>
    <div className="sec-h"><div><div className="sec-t">📸 Team Gallery</div><div className="sec-s">Select team to manage photos</div></div></div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10}}>
      {teams.map(t=><div key={t.id} className="card" style={{cursor:'pointer',textAlign:'center',padding:'14px 10px'}} onClick={()=>setSelTeam(t)}>
        {t.logo?<img src={t.logo} style={{width:44,height:44,borderRadius:10,objectFit:'cover',margin:'0 auto 6px',display:'block'}} alt={t.name}/>
